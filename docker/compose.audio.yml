# Optional headed Audio container.
# Forwards the host display and PulseAudio/ALSA so the hologram UI and local
# mic/speaker work inside the container. Only use this if you really need Audio
# in Docker; bare metal is simpler.

services:
  audio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.audio
    image: audio:latest
    container_name: audio
    restart: unless-stopped
    environment:
      WARDEN_URL: "${WARDEN_URL:-http://warden:3200}"
      SATELLITE_URL: "${SATELLITE_URL:-}"
      DISPLAY: "${DISPLAY:-:0}"
      PULSE_SERVER: "${PULSE_SERVER:-unix:/run/user/1000/pulse/native}"
      QT_QPA_PLATFORM: xcb
    ports:
      - "${AUDIO_PORT:-3201}:3201"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - "${XAUTHORITY:-/tmp/.docker.xauth}:/tmp/.docker.xauth:ro"
      - /run/user/1000/pulse:/run/user/1000/pulse
    networks:
      - warden
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Running a GUI as root inside a container can be brittle.
    # Provide host ipc for PulseAudio shared memory.
    ipc: host

networks:
  warden:
    external: true
