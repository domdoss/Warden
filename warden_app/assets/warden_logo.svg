<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16181b"/>
      <stop offset="60%" stop-color="#0a0b0c"/>
      <stop offset="100%" stop-color="#050606"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f3f5"/>
      <stop offset="45%" stop-color="#c2c6ca"/>
      <stop offset="100%" stop-color="#6f7479"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="wclip">
      <path d="M92 132 L148 388 L256 132 L364 388 L420 132" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="butt" stroke-linejoin="miter"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- concrete seams (behind the W, subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="0" y1="150" x2="512" y2="150"/>
    <line x1="0" y1="250" x2="512" y2="250"/>
    <line x1="0" y1="350" x2="512" y2="350"/>
  </g>

  <!-- dark edge / bevel -->
  <path d="M92 132 L148 388 L256 132 L364 388 L420 132"
        fill="none" stroke="#2b2e31" stroke-width="60" stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- main silver W -->
  <path d="M92 132 L148 388 L256 132 L364 388 L420 132"
        fill="none" stroke="url(#silver)" stroke-width="52" stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- top sheen -->
  <path d="M92 132 L148 388 L256 132 L364 388 L420 132"
        fill="none" stroke="url(#sheen)" stroke-width="52" stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- concrete cracks/texture clipped to the W -->
  <g clip-path="url(#wclip)" stroke="#242628" stroke-opacity="0.5" stroke-width="3">
    <line x1="120" y1="120" x2="128" y2="400"/>
    <line x1="168" y1="140" x2="162" y2="390"/>
    <line x1="256" y1="120" x2="258" y2="300"/>
    <line x1="344" y1="120" x2="346" y2="300"/>
    <line x1="392" y1="130" x2="388" y2="400"/>
    <line x1="150" y1="250" x2="200" y2="252"/>
    <line x1="300" y1="250" x2="360" y2="252"/>
    <line x1="180" y1="330" x2="340" y2="330"/>
  </g>

  <!-- ground plinth -->
  <rect x="96" y="420" width="320" height="6" fill="#5c6064"/>
  <rect x="96" y="430" width="320" height="3" fill="#3a3d40"/>
</svg>
