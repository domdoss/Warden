name: warden_app
description: Warden — your AI assistant and BBS, on Android. Chat, boards, files, mail, doors, and a built-in Tailscale tunnel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  speech_to_text: ^7.2.0
  flutter_tts: ^4.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  flutter_markdown: ^0.7.4
  webview_flutter: ^4.10.0
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jarvis.html
    - assets/three.min.js
    - assets/mascot/
