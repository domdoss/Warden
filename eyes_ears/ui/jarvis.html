<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        body {
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #00ffff;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        /* Flip card — front is the hologram, back is the oculus feed.
           The card fills the viewport so the hologram stays full-screen. */
        .flip-card {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            z-index: 1;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform .6s ease;
        }
        .flip-card-inner.flipped { transform: rotateY(180deg); }
        .flip-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-face.front { z-index: 2; }
        .flip-face.back { transform: rotateY(180deg); overflow: auto; }

        /* Hologram canvas container — radial fade hides the square window edge.
           Now doubles as the flip-card front face, so it carries .flip-face.front
           in the DOM; the position/mask/pointer-events stay identical. */
        .hologram-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 75%);
            mask-image: radial-gradient(circle at center, black 35%, transparent 75%);
        }

        #hologramCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD layer (timer, mini holograms) — lives on the front face so it
           flips away with the hologram. Still pointer-events:none. */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Flip toggle — sits in the top-right corner on top of both faces so
           it stays reachable no matter which side is shown. */
        #flip-toggle {
            position: fixed;
            top: 2vmin;
            left: 2vmin;
            z-index: 10;
            pointer-events: auto;
            background: rgba(5, 8, 12, 0.7);
            color: #00ffff;
            border: 0.3vmin solid #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 2vmin;
            letter-spacing: 0.2vmin;
            text-transform: uppercase;
            padding: 1vmin 1.6vmin;
            cursor: pointer;
            box-shadow: 0 0 1.5vmin rgba(0, 255, 255, 0.35);
        }
        #flip-toggle:active { background: rgba(0, 255, 255, 0.15); }

        /* Oculus back face */
        .oculus-face {
            background: rgba(5, 8, 12, 0.92);
            color: #c8e8ec;
            font-family: 'Courier New', monospace;
            padding: 3vmin;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2vmin;
            overflow: auto;
        }
        .oculus-face h2 {
            color: #00ffff;
            font-size: 3.2vmin;
            letter-spacing: 0.4vmin;
            text-transform: uppercase;
            text-shadow: 0 0 1.2vmin #00ffff;
            margin: 0;
        }
        #oculus-feed {
            width: 100%;
            max-height: 50vh;
            object-fit: contain;
            background: #000;
            border: 0.3vmin solid #00ffff44;
            box-shadow: 0 0 2vmin rgba(0, 255, 255, 0.2);
        }
        #oculus-status {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2vmin;
            font-size: 2vmin;
            align-items: center;
        }
        .oculus-pill {
            padding: 0.6vmin 1.2vmin;
            border: 0.2vmin solid #00ffff66;
            border-radius: 1vmin;
            background: rgba(0, 255, 255, 0.06);
            color: #c8e8ec;
            letter-spacing: 0.15vmin;
            text-transform: uppercase;
        }
        .oculus-pill.eyes-open { border-color: #4a8aff; color: #8ab4f8; background: rgba(74, 138, 255, 0.1); box-shadow: 0 0 1.5vmin rgba(74, 138, 255, 0.25); }
        .oculus-pill.eyes-closed { border-color: #00ff66; color: #66ff99; background: rgba(0, 255, 102, 0.1); }
        .oculus-btns { display: flex; flex-wrap: wrap; gap: 1.2vmin; }
        .oculus-btns button {
            background: transparent;
            color: #00ffff;
            border: 0.3vmin solid #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 2vmin;
            letter-spacing: 0.2vmin;
            text-transform: uppercase;
            padding: 1vmin 1.8vmin;
            cursor: pointer;
            box-shadow: 0 0 1.2vmin rgba(0, 255, 255, 0.25);
        }
        .oculus-btns button:hover:not(:disabled) { background: rgba(0, 255, 255, 0.1); }
        .oculus-btns button:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
        .oculus-ip-row {
            display: flex;
            align-items: center;
            gap: 1.2vmin;
            flex-wrap: wrap;
            font-size: 2vmin;
        }
        .oculus-ip-row label { display: flex; align-items: center; gap: 1vmin; flex: 1 1 auto; }
        #oculus-ip {
            flex: 1 1 auto;
            min-width: 18vmin;
            background: rgba(0, 0, 0, 0.5);
            color: #c8e8ec;
            border: 0.3vmin solid #00ffff66;
            font-family: 'Courier New', monospace;
            font-size: 2vmin;
            padding: 0.8vmin 1.2vmin;
        }
        #oculus-ip:focus { outline: none; border-color: #00ffff; }
        #oculus-ip-save {
            background: transparent;
            color: #00ffff;
            border: 0.3vmin solid #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 2vmin;
            letter-spacing: 0.2vmin;
            text-transform: uppercase;
            padding: 0.8vmin 1.6vmin;
            cursor: pointer;
        }
        #oculus-msg {
            font-size: 1.8vmin;
            color: #ff5577;
            min-height: 1.8vmin;
        }
        #oculus-msg.ok { color: #66ff99; }

        /* Timer - top right */
        .timer-slot {
            position: absolute;
            top: 3vmin;
            right: 3vmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vmin;
            opacity: 0;
            transition: opacity 300ms ease;
        }

        .timer-slot.visible {
            opacity: 1;
        }

        .timer-ring {
            width: 50vmin;
            height: 50vmin;
            border-radius: 50%;
            background: #0a0a0a;
            border: 0.6vmin solid #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 4vmin rgba(0, 255, 255, 0.4),
                inset 0 0 4vmin rgba(0, 255, 255, 0.2);
        }

        .timer-value {
            font-size: 15vmin;
            font-weight: bold;
            color: #00ffff;
            text-shadow:
                0 0 2vmin #00ffff,
                0 0 4vmin #00ffff;
        }

        .timer-label {
            font-size: 4vmin;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.3vmin;
            color: #00ffff;
            text-shadow: 0 0 1.5vmin #00ffff;
            max-width: 50vmin;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Mini hologram slots - bottom */
        .mini-slots {
            position: absolute;
            bottom: 2vmin;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 1.5vmin;
            padding: 0 2vmin;
        }

        .mini-slot {
            width: 12vmin;
            height: 12vmin;
            border-radius: 50%;
            background: transparent;
            border: 0.3vmin solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 300ms ease, background 300ms ease, border-color 300ms ease, box-shadow 300ms ease;
            overflow: hidden;
        }

        .mini-slot.active {
            opacity: 1;
            border-color: rgba(0, 255, 255, 0.5);
            background: rgba(0, 255, 255, 0.05);
            box-shadow:
                0 0 2vmin rgba(0, 255, 255, 0.3),
                inset 0 0 2vmin rgba(0, 255, 255, 0.15);
        }

        .mini-slot.flash-success {
            border-color: #00ff66;
            background: rgba(0, 255, 102, 0.4);
            box-shadow:
                0 0 3vmin rgba(0, 255, 102, 0.8),
                inset 0 0 2vmin rgba(0, 255, 102, 0.4);
        }

        .mini-slot.flash-failure {
            border-color: #ff0033;
            background: rgba(255, 0, 51, 0.4);
            box-shadow:
                0 0 3vmin rgba(255, 0, 51, 0.8),
                inset 0 0 2vmin rgba(255, 0, 51, 0.4);
        }

        .mini-label {
            font-size: 1.8vmin;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 0.2vmin;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 0.5vmin;
        }

        /* Portrait 900x1600 adjustments */
        @media (orientation: portrait) {
            .timer-ring { width: 42vmin; height: 42vmin; }
            .timer-value { font-size: 13vmin; }
        }

        /* Settings moved to the Warden Dashboard window (panels.html). */
    </style>
</head>
<body>
    <!-- Flip-card: front = 3D hologram + HUD, back = oculus feed + settings -->
    <div class="flip-card">
        <button id="flip-toggle" title="Flip card">Oculus</button>
        <div class="flip-card-inner" id="flipInner">
            <div class="flip-face front">
                <!-- 3D hologram canvas -->
                <div class="hologram-container">
                    <canvas id="hologramCanvas"></canvas>
                </div>

                <!-- HUD layer -->
                <div class="hud">
                    <!-- Top-right: timer slot (initially hidden) -->
                    <div id="timer-slot" class="timer-slot">
                        <div class="timer-ring">
                            <div id="timer-value" class="timer-value">0</div>
                        </div>
                        <div id="timer-label" class="timer-label"></div>
                    </div>

                    <!-- Settings gear + panel moved to the Warden Dashboard (panels.html)
                         window — it lived on the hologram but wasn't obviously part of it,
                         and the dashboard is where widget show/hide controls belong. -->

                    <!-- Bottom: mini hologram slots (6 blank stubs) -->
                    <div class="mini-slots" id="mini-slots">
                        <div class="mini-slot" data-slot="0"></div>
                        <div class="mini-slot" data-slot="1"></div>
                        <div class="mini-slot" data-slot="2"></div>
                        <div class="mini-slot" data-slot="3"></div>
                        <div class="mini-slot" data-slot="4"></div>
                        <div class="mini-slot" data-slot="5"></div>
                    </div>
                </div>
            </div>

            <div class="flip-face back">
                <div class="oculus-face">
                    <h2>Oculus</h2>
                    <img id="oculus-feed" alt="live feed">
                    <div id="oculus-status">—</div>
                    <div class="oculus-btns">
                        <button id="oculus-open">Open Eyes</button>
                        <button id="oculus-close">Close Eyes</button>
                        <button id="oculus-alert-close">Acknowledge alert</button>
                    </div>
                    <div class="oculus-ip-row">
                        <label>Frame server <input id="oculus-ip" placeholder="host or IP"></label>
                        <button id="oculus-ip-save">Save</button>
                    </div>
                    <div id="oculus-msg"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/three.min.js"></script>
    <script>
        // ── iframe postMessage bridge shim ──
        // When the hologram runs inside panels.html (a cross-origin file://
        // iframe), window.pywebview is absent. Build a proxy that forwards
        // api calls to the parent via postMessage and awaits the result —
        // same shim the other panels use. No-op when run as a top-level
        // window (pywebview injects the bridge).
        if(!window.pywebview && window.parent && window.parent !== window){
            var _pending={};
            window.addEventListener('message', function(ev){
                var d=ev.data; if(!d||!d.__pm||!d.id||!_pending[d.id])return;
                var p=_pending[d.id]; delete _pending[d.id]; clearTimeout(p.timer);
                if(d.error)p.reject(new Error(d.error)); else p.resolve(d.result);
            });
            window.pywebview={api:new Proxy({},{
                get:function(_,method){
                    return function(){
                        var args=Array.prototype.slice.call(arguments);
                        return new Promise(function(resolve,reject){
                            var id='pm-'+Math.random().toString(36).slice(2);
                            var timer=setTimeout(function(){delete _pending[id];reject(new Error('bridge timeout: '+method));},30000);
                            _pending[id]={resolve:resolve,reject:reject,timer:timer};
                            window.parent.postMessage({__pm:true,id:id,method:method,args:args},'*');
                        });
                    };
                }
            })};
        }

        // ======================================================================
        // Hologram (adapted from jarvis-hologram.html, mic-free)
        // The hologram itself IS the state indicator. setState(name) changes
        // the target color and motion parameters; animate() lerps toward them.
        // ======================================================================

        // State -> visual parameters.
        //   color         : THREE.Color target for all materials
        //   coreSpeed     : base pulse frequency multiplier for core sin()
        //   particleDrift : multiplier for particle velocity + rotation
        //   ringSpeed    : multiplier for ring rotation speeds
        //   pulseAmp      : amplitude multiplier on the core pulse
        //   flash         : true => opacity ping-pong error flash
        const STATE_PARAMS = {
            idle: {
                color: 0x00ffff,
                coreSpeed: 0.001,
                particleDrift: 1.0,
                ringSpeed: 1.0,
                pulseAmp: 0.10,
                flash: false
            },
            listening: {
                // ~1.4Hz core pulse => sin(t * 2*PI*1.4 / 1000) ≈ sin(t * 0.0088)
                color: 0xff2b2b,
                coreSpeed: 0.0088,
                particleDrift: 1.8,
                ringSpeed: 1.2,
                pulseAmp: 0.18,
                flash: false
            },
            processing: {
                color: 0xffaa00,
                coreSpeed: 0.0035,
                particleDrift: 3.8,
                ringSpeed: 2.6,
                pulseAmp: 0.14,
                flash: false,
                jitter: 0.06,
                scatter: 0.035,
            },
            speaking: {
                color: 0x00ffff,
                coreSpeed: 0.002,
                particleDrift: 1.3,
                ringSpeed: 1.3,
                pulseAmp: 0.10,
                flash: false
            },
            error: {
                color: 0xff0000,
                coreSpeed: 0.003,
                particleDrift: 1.0,
                ringSpeed: 1.0,
                pulseAmp: 0.12,
                flash: true
            }
        };

        class JarvisHologram {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    alpha: true,
                    antialias: true
                });

                this.audioLevel = 0;
                this.targetAudioLevel = 0;
                this.particles = [];
                this.rings = [];
                this.orbitalRings = [];

                this._ready = false;

                // State tracking — target color is lerped toward each frame.
                this.state = 'idle';
                this.stateParams = STATE_PARAMS.idle;
                this.targetColor = new THREE.Color(STATE_PARAMS.idle.color);
                this.currentColor = new THREE.Color(STATE_PARAMS.idle.color);

                this.init();
            }

            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000000, 0);
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                // Pulled back a touch so the orb reads a little smaller and
                // sits clearly centered in the window.
                this.camera.position.z = 11;

                this.createCore();
                this.createParticleCloud();
                this.createRings();
                this.createOrbitalRings();
                this.createEnergyField();

                // Collect all materials we want to color-lerp each frame.
                this.coloredMaterials = [
                    this.core.material,
                    this.innerGlow.material,
                    this.wireframeSphere.material,
                    this.energyField.material,
                    this.particleSystem.material,
                    ...this.rings.map(r => r.material),
                    ...this.orbitalRings.map(r => r.material)
                ];

                // Base opacities — flash effect modulates around these. Bumped
                // for contrast so the hologram stays visible against bright
                // backgrounds (it was too faint to see at times).
                this.baseOpacities = {
                    core: 0.55,
                    innerGlow: 0.82,
                    wireframeSphere: 0.62,
                    energyField: 0.22,
                    particles: 0.85,
                    rings: this.rings.map((_, i) => 0.42 - i * 0.04),
                    orbitalRings: this.orbitalRings.map(() => 0.68)
                };

                this.animate();

                window.addEventListener('resize', () => this.onResize());

                this._ready = true;
            }

            createCore() {
                const coreGeometry = new THREE.SphereGeometry(0.8, 32, 32);
                const coreMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.3,
                    wireframe: false
                });
                this.core = new THREE.Mesh(coreGeometry, coreMaterial);
                this.scene.add(this.core);

                const glowGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.6
                });
                this.innerGlow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.scene.add(this.innerGlow);

                const wireframeGeometry = new THREE.SphereGeometry(0.9, 16, 16);
                const wireframeMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.4
                });
                this.wireframeSphere = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
                this.scene.add(this.wireframeSphere);
            }

            createParticleCloud() {
                const particleCount = 2000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const velocities = [];
                const originalPositions = [];

                for (let i = 0; i < particleCount * 3; i += 3) {
                    const radius = 2 + Math.random() * 4;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;

                    const x = radius * Math.sin(phi) * Math.cos(theta);
                    const y = radius * Math.sin(phi) * Math.sin(theta);
                    const z = radius * Math.cos(phi);

                    positions[i] = x;
                    positions[i + 1] = y;
                    positions[i + 2] = z;

                    originalPositions.push({ x, y, z });

                    velocities.push({
                        x: (Math.random() - 0.5) * 0.01,
                        y: (Math.random() - 0.5) * 0.01,
                        z: (Math.random() - 0.5) * 0.01
                    });
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: 0x00ffff,
                    size: 0.05,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending
                });

                this.particleSystem = new THREE.Points(geometry, material);
                this.particleVelocities = velocities;
                this.particleOriginalPositions = originalPositions;
                this.scene.add(this.particleSystem);
            }

            createRings() {
                for (let i = 0; i < 5; i++) {
                    const geometry = new THREE.TorusGeometry(2 + i * 0.6, 0.015, 16, 100);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x00ffff,
                        transparent: true,
                        opacity: 0.25 - i * 0.03,
                        wireframe: false
                    });
                    const ring = new THREE.Mesh(geometry, material);
                    ring.rotation.x = Math.PI / 2;
                    this.rings.push(ring);
                    this.scene.add(ring);
                }
            }

            createOrbitalRings() {
                for (let i = 0; i < 3; i++) {
                    const geometry = new THREE.TorusGeometry(1.5 + i * 0.3, 0.02, 8, 64);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x00ffff,
                        transparent: true,
                        opacity: 0.5,
                        wireframe: true
                    });
                    const ring = new THREE.Mesh(geometry, material);
                    const angle = (i * Math.PI * 2) / 3;
                    ring.rotation.set(angle, angle * 0.5, 0);
                    this.orbitalRings.push(ring);
                    this.scene.add(ring);
                }
            }

            createEnergyField() {
                const geometry = new THREE.IcosahedronGeometry(3, 1);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.1
                });
                this.energyField = new THREE.Mesh(geometry, material);
                this.scene.add(this.energyField);
            }

            setAudioLevel(level) {
                const n = Number(level);
                if (!Number.isFinite(n)) return;
                this.targetAudioLevel = Math.max(0, Math.min(2, n));
            }

            setState(name) {
                const params = STATE_PARAMS[name];
                if (!params) return;
                this.state = name;
                this.stateParams = params;
                this.targetColor = new THREE.Color(params.color);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const now = Date.now();
                const params = this.stateParams;

                // Smooth audio level transitions
                this.audioLevel += (this.targetAudioLevel - this.audioLevel) * 0.1;

                // Color lerp (~200ms at 60fps ≈ 0.1 alpha per frame)
                this.currentColor.lerp(this.targetColor, 0.1);
                for (const mat of this.coloredMaterials) {
                    mat.color.copy(this.currentColor);
                }

                // Core pulsing — coreSpeed drives the sin frequency, pulseAmp its amplitude.
                // When speaking, audio level contributes prominently to the core pulse.
                const audioWeight = this.state === 'speaking' ? 1.4 : 0.5;
                const basePulse = 1 + Math.sin(now * params.coreSpeed) * params.pulseAmp;
                const audioPulse = this.audioLevel * audioWeight;
                const totalPulse = basePulse + audioPulse;

                this.core.scale.set(totalPulse, totalPulse, totalPulse);
                this.innerGlow.scale.set(totalPulse * 0.8, totalPulse * 0.8, totalPulse * 0.8);
                this.wireframeSphere.scale.set(totalPulse * 1.1, totalPulse * 1.1, totalPulse * 1.1);

                // Inner-glow opacity modulated by audio level for a breath-alive feel.
                this.innerGlow.material.opacity = Math.max(
                    0.2,
                    Math.min(1, this.baseOpacities.innerGlow + this.audioLevel * 0.35)
                );

                // Rotation — processing spins the wireframe the opposite way ("thinking").
                this.core.rotation.y += 0.003 * params.ringSpeed + this.audioLevel * 0.02;
                this.core.rotation.x += 0.002 * params.ringSpeed + this.audioLevel * 0.01;
                const wireDir = this.state === 'processing' ? 1 : -1;
                this.wireframeSphere.rotation.y += wireDir * (0.004 * params.ringSpeed - this.audioLevel * 0.015);
                this.wireframeSphere.rotation.x += wireDir * 0.002;

                // Rings animation
                this.rings.forEach((ring, i) => {
                    ring.rotation.z += 0.001 * (i + 1) * params.ringSpeed + this.audioLevel * 0.01;
                    const ringPulse = 1 + Math.sin(now * 0.002 + i) * 0.05 + this.audioLevel * 0.35;
                    ring.scale.set(ringPulse, ringPulse, 1);
                    ring.material.opacity = this.baseOpacities.rings[i] + this.audioLevel * 0.4;
                });

                // Orbital rings
                this.orbitalRings.forEach((ring, i) => {
                    ring.rotation.x += (0.005 + this.audioLevel * 0.02) * params.ringSpeed;
                    ring.rotation.y += (0.003 + this.audioLevel * 0.015) * params.ringSpeed;
                    ring.rotation.z += 0.002 * (i + 1) * params.ringSpeed + this.audioLevel * 0.01;
                });

                // Energy field
                this.energyField.rotation.x += 0.001 * params.ringSpeed + this.audioLevel * 0.01;
                this.energyField.rotation.y += 0.002 * params.ringSpeed + this.audioLevel * 0.015;
                this.energyField.material.opacity = this.baseOpacities.energyField + this.audioLevel * 0.3;

                // Particle animation — drift scales with stateParams.particleDrift.
                const drift = params.particleDrift;
                const jitter = params.jitter || 0;
                const scatter = params.scatter || 0;
                const positions = this.particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    const idx = i / 3;

                    positions[i] += this.particleVelocities[idx].x * drift;
                    positions[i + 1] += this.particleVelocities[idx].y * drift;
                    positions[i + 2] += this.particleVelocities[idx].z * drift;

                    // Per-frame random jitter (makes the cloud feel alive when "thinking")
                    if (jitter > 0) {
                        positions[i] += (Math.random() - 0.5) * jitter;
                        positions[i + 1] += (Math.random() - 0.5) * jitter;
                        positions[i + 2] += (Math.random() - 0.5) * jitter;
                    }

                    const distance = Math.sqrt(
                        positions[i] ** 2 +
                        positions[i + 1] ** 2 +
                        positions[i + 2] ** 2
                    );

                    // Extra outward scatter while processing so particles bloom further out
                    if (scatter > 0 && distance > 0.001) {
                        const dirX = positions[i] / distance;
                        const dirY = positions[i + 1] / distance;
                        const dirZ = positions[i + 2] / distance;
                        positions[i] += dirX * scatter;
                        positions[i + 1] += dirY * scatter;
                        positions[i + 2] += dirZ * scatter;
                    }

                    const outerBound = scatter > 0 ? 7.5 : 6;
                    if (distance > outerBound || distance < 1.5) {
                        this.particleVelocities[idx].x *= -1;
                        this.particleVelocities[idx].y *= -1;
                        this.particleVelocities[idx].z *= -1;
                    }

                    if (this.audioLevel > 0.1) {
                        const dirX = positions[i] / distance;
                        const dirY = positions[i + 1] / distance;
                        const dirZ = positions[i + 2] / distance;

                        const pushForce = this.audioLevel * 0.04;
                        positions[i] += dirX * pushForce;
                        positions[i + 1] += dirY * pushForce;
                        positions[i + 2] += dirZ * pushForce;
                    }

                    if (distance > 4) {
                        const centerForce = (distance - 4) * 0.01;
                        const dirX = positions[i] / distance;
                        const dirY = positions[i + 1] / distance;
                        const dirZ = positions[i + 2] / distance;

                        positions[i] -= dirX * centerForce;
                        positions[i + 1] -= dirY * centerForce;
                        positions[i + 2] -= dirZ * centerForce;
                    }
                }
                this.particleSystem.geometry.attributes.position.needsUpdate = true;

                // Particle system rotation speed scales with particleDrift.
                this.particleSystem.rotation.y += (0.0005 + this.audioLevel * 0.005) * drift;

                // Error flash — opacity ping-pongs ±0.3 over 300ms (~3.33Hz).
                if (params.flash) {
                    const t = (now % 300) / 300;               // 0..1 every 300ms
                    const flashDelta = Math.sin(t * Math.PI * 2) * 0.3;
                    this.core.material.opacity = Math.max(0.05, this.baseOpacities.core + flashDelta);
                    this.wireframeSphere.material.opacity = Math.max(0.05, this.baseOpacities.wireframeSphere + flashDelta);
                    this.particleSystem.material.opacity = Math.max(0.1, this.baseOpacities.particles + flashDelta);
                } else {
                    // Restore base opacities (core / wireframe / particles).
                    this.core.material.opacity = this.baseOpacities.core;
                    this.wireframeSphere.material.opacity = this.baseOpacities.wireframeSphere;
                    this.particleSystem.material.opacity = this.baseOpacities.particles;
                }

                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
            }
        }

        // ======================================================================
        // Jarvis — state management + public JS API
        // ======================================================================
        const STATES = ['idle', 'listening', 'processing', 'speaking', 'error'];

        const hologram = new JarvisHologram('hologramCanvas');

        const timerSlotEl = document.getElementById('timer-slot');
        const timerValueEl = document.getElementById('timer-value');
        const timerLabelEl = document.getElementById('timer-label');
        const miniSlotsContainer = document.getElementById('mini-slots');

        let currentState = 'idle';
        // Flip-card state. When flipped, the oculus face is shown and the
        // hologram press-to-talk is disabled (a press flips back instead).
        let flipped = false;
        let statusPollId = null;
        let framePollId = null;
        // Timers: id -> { label, secondsRemaining }
        const activeTimers = new Map();
        // Mini holograms: id -> slotIndex
        const activeMiniHolograms = new Map();

        function setState(state) {
            if (!STATES.includes(state)) {
                console.warn('[jarvis] Unknown state:', state);
                return;
            }
            currentState = state;
            hologram.setState(state);
        }

        function renderTimer() {
            if (activeTimers.size === 0) {
                timerSlotEl.classList.remove('visible');
                return;
            }
            // Pick the timer with the lowest remaining seconds (most urgent).
            let best = null;
            for (const t of activeTimers.values()) {
                if (best === null || t.secondsRemaining < best.secondsRemaining) {
                    best = t;
                }
            }
            timerValueEl.textContent = formatSeconds(best.secondsRemaining);
            timerLabelEl.textContent = best.label || '';
            timerSlotEl.classList.add('visible');
        }

        function formatSeconds(s) {
            const n = Math.max(0, Math.round(Number(s) || 0));
            if (n < 60) return String(n);
            const m = Math.floor(n / 60);
            const sec = n % 60;
            return m + ':' + String(sec).padStart(2, '0');
        }

        function setTimer(opts) {
            if (!opts || typeof opts !== 'object') return;
            const id = opts.id != null ? String(opts.id) : 'default';
            const label = opts.label != null ? String(opts.label) : '';
            // Accept both snake_case (Python) and camelCase.
            const seconds = opts.seconds_remaining != null
                ? opts.seconds_remaining
                : opts.secondsRemaining;
            activeTimers.set(id, {
                label,
                secondsRemaining: Math.max(0, Number(seconds) || 0)
            });
            renderTimer();
        }

        function clearTimer(id) {
            const key = id != null ? String(id) : 'default';
            activeTimers.delete(key);
            renderTimer();
        }

        // --- Mini hologram stubs (Phase 4) ---
        function addMiniHologram(opts) {
            if (!opts || typeof opts !== 'object') return;
            const id = opts.id != null ? String(opts.id) : null;
            if (!id) return;
            if (activeMiniHolograms.has(id)) return;

            const slots = miniSlotsContainer.querySelectorAll('.mini-slot');
            let targetIdx = -1;
            for (let i = 0; i < slots.length; i++) {
                if (!slots[i].classList.contains('active')) {
                    targetIdx = i;
                    break;
                }
            }
            if (targetIdx === -1) {
                console.warn('[jarvis] No free mini-hologram slot');
                return;
            }
            const slot = slots[targetIdx];
            slot.classList.add('active');
            slot.innerHTML = '';
            const label = document.createElement('div');
            label.className = 'mini-label';
            label.textContent = opts.label || '';
            slot.appendChild(label);
            activeMiniHolograms.set(id, targetIdx);
        }

        function removeMiniHologram(id, status) {
            const key = id != null ? String(id) : null;
            if (!key) return;
            const idx = activeMiniHolograms.get(key);
            if (idx == null) return;
            const slot = miniSlotsContainer.querySelectorAll('.mini-slot')[idx];
            if (!slot) {
                activeMiniHolograms.delete(key);
                return;
            }

            const flashClass = status === 'success'
                ? 'flash-success'
                : (status === 'failure' ? 'flash-failure' : null);

            const finalize = () => {
                slot.classList.remove('active', 'flash-success', 'flash-failure');
                slot.innerHTML = '';
                activeMiniHolograms.delete(key);
            };

            if (flashClass) {
                slot.classList.add(flashClass);
                setTimeout(finalize, 600);
            } else {
                finalize();
            }
        }

        // --- Public API ---
        // Exposed on window.jarvis:
        //   jarvis.setState(state)                      — 'idle'|'listening'|'processing'|'speaking'|'error'
        //   jarvis.setAudioLevel(level)                 — number 0..2, drives hologram pulse
        //   jarvis.setTimer({id, label, seconds_remaining})
        //   jarvis.clearTimer(id)
        //   jarvis.addMiniHologram({id, label})         — Phase 4 stub
        //   jarvis.removeMiniHologram(id, status)       — 'success' | 'failure'
        //   jarvis.ready()                              — true once three.js + DOM loaded
        const jarvis = {
            setState: setState,
            setAudioLevel: (level) => hologram.setAudioLevel(level),
            setTimer: setTimer,
            clearTimer: clearTimer,
            addMiniHologram: addMiniHologram,
            removeMiniHologram: removeMiniHologram,
            ready: () => !!hologram && hologram._ready === true && document.readyState === 'complete'
        };
        window.jarvis = jarvis;

        // ── Host → iframe state channel ──
        // panels.html evals holoBroadcast({cmd,...}) which postMessages here.
        window.addEventListener('message', function(ev){
            var d = ev.data;
            if(!d || !d.__pm || !d.cmd) return;
            try {
                if(d.cmd === 'state') jarvis.setState(d.state);
                else if(d.cmd === 'audio') jarvis.setAudioLevel(d.level);
                else if(d.cmd === 'timer') jarvis.setTimer(d.payload);
                else if(d.cmd === 'cleartimer') jarvis.clearTimer(d.id);
                else if(d.cmd === 'mini') jarvis.addMiniHologram(d.payload);
                else if(d.cmd === 'removemini') jarvis.removeMiniHologram(d.id, d.status);
            } catch(e) { console.log('[jarvis] holo cmd failed', d.cmd, e); }
        });
        // Tell the parent the hologram API is bound and ready for state.
        if(window.parent && window.parent !== window){
            try { window.parent.postMessage({__pm:true, type:'hologram_ready'}, '*'); } catch(e){}
        }

        // ======================================================================
        // Input: click/touch anywhere = button press
        // ======================================================================
        function callApi(methodName, ...args) {
            try {
                if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[methodName] === 'function') {
                    const result = window.pywebview.api[methodName](...args);
                    // pywebview returns a Promise; swallow rejections.
                    if (result && typeof result.catch === 'function') {
                        result.catch(err => console.log('[jarvis] API', methodName, 'error:', err));
                    }
                    return result;
                } else {
                    console.log('[jarvis] pywebview.api.' + methodName + ' not ready');
                }
            } catch (err) {
                console.log('[jarvis] API call failed:', methodName, err);
            }
        }

        // The hologram IS the stop button. When it's orange/thinking
        // (processing state), a press hard-kills the agent on the Pi —
        // POST /api/chat/stop {hard:true} sends SIGKILL via killCurrentAgent,
        // and hologram_click interrupts the voice side (playback/recording).
        // In any other state a press is the normal toggle (start/stop a turn).
        function hologramPress() {
            // If the oculus face is showing, a press flips back to the
            // hologram instead of triggering press-to-talk / hard-kill.
            if (flipped) { flipCard(); return; }
            if (currentState === 'processing') {
                callApi('warden_api', '/api/chat/stop', 'POST', JSON.stringify({ hard: true }));
            }
            callApi('hologram_click');
        }

        // ======================================================================
        // Flip-card + oculus face
        // ======================================================================
        // callApi returns the pywebview promise (or undefined if the bridge
        // isn't ready). These helpers await + JSON.parse the result, returning
        // null on any failure so callers can render an error instead of
        // throwing through the poll loop.
        async function apiGet(path) {
            try {
                const r = await callApi('warden_api', path);
                if (!r) return null;
                return JSON.parse(r);
            } catch (e) {
                console.log('[jarvis] apiGet', path, 'failed:', e);
                return null;
            }
        }
        async function apiPost(path, body) {
            try {
                const r = await callApi('warden_api', path, 'POST', JSON.stringify(body || {}));
                if (!r) return null;
                return JSON.parse(r);
            } catch (e) {
                console.log('[jarvis] apiPost', path, 'failed:', e);
                return null;
            }
        }

        function oculusMsg(text, ok) {
            const el = document.getElementById('oculus-msg');
            if (!el) return;
            el.textContent = text || '';
            el.classList.toggle('ok', !!ok);
        }

        function humanizeTs(ts) {
            if (!ts) return '';
            const n = Number(ts);
            const d = n > 1e12 ? new Date(n) : new Date(n * 1000);
            if (isNaN(d.getTime())) return String(ts);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return Math.max(0, Math.round(diff)) + 's ago';
            if (diff < 3600) return Math.round(diff / 60) + 'm ago';
            if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
            return d.toLocaleString();
        }

        function renderOculusStatus(s) {
            const el = document.getElementById('oculus-status');
            if (!el) return;
            el.innerHTML = '';
            if (!s || s.ok === false) {
                const err = document.createElement('div');
                err.className = 'oculus-pill';
                err.style.borderColor = '#ff0033';
                err.style.color = '#ff5577';
                err.textContent = 'status: ' + (s && s.error ? s.error : 'unavailable');
                el.appendChild(err);
                return;
            }
            const statePill = document.createElement('div');
            statePill.className = 'oculus-pill';
            statePill.textContent = 'state: ' + (s.state || '—');
            el.appendChild(statePill);

            const armPill = document.createElement('div');
            armPill.className = 'oculus-pill ' + (s.eyes_open ? 'eyes-open' : 'eyes-closed');
            armPill.textContent = s.eyes_open ? 'EYES OPEN' : 'EYES CLOSED';
            el.appendChild(armPill);

            if (s.last_alert_ts) {
                const la = document.createElement('div');
                la.className = 'oculus-pill';
                la.textContent = 'last alert: ' + humanizeTs(s.last_alert_ts);
                el.appendChild(la);
            }

            // Open/Close disabled state tracks current eyes_open value.
            document.getElementById('oculus-open').disabled = !!s.eyes_open;
            document.getElementById('oculus-close').disabled = !s.eyes_open;
        }

        async function pollOculusStatus() {
            try {
                const s = await apiGet('/api/oculus/status');
                renderOculusStatus(s);
            } catch (e) {
                console.log('[jarvis] status poll failed:', e);
            }
        }

        async function pollOculusFrame() {
            try {
                const f = await apiGet('/api/oculus/frame');
                if (f && f.ok && f.data) {
                    document.getElementById('oculus-feed').src = 'data:image/jpeg;base64,' + f.data;
                } else if (f && f.ok === false) {
                    oculusMsg(f.error || 'frame unavailable');
                }
            } catch (e) {
                console.log('[jarvis] frame poll failed:', e);
            }
        }

        function startOculusPolls() {
            stopOculusPolls();
            // Status is light — every 3s. Frame is heavier — every 700ms and
            // only while the back face is visible.
            statusPollId = setInterval(pollOculusStatus, 3000);
            framePollId = setInterval(pollOculusFrame, 700);
            // Fire once immediately so the face isn't blank for a beat.
            pollOculusStatus();
            pollOculusFrame();
        }

        function stopOculusPolls() {
            if (statusPollId) { clearInterval(statusPollId); statusPollId = null; }
            if (framePollId) { clearInterval(framePollId); framePollId = null; }
        }

        async function prefillOculusIp() {
            const s = await apiGet('/api/settings');
            if (s && s.securitySatelliteIp != null) {
                const ip = document.getElementById('oculus-ip');
                if (ip && !ip.value) ip.value = s.securitySatelliteIp;
            } else if (s && s.ok === false) {
                oculusMsg(s.error || 'settings unavailable');
            }
        }

        function flipCard() {
            flipped = !flipped;
            const inner = document.getElementById('flipInner');
            if (inner) inner.classList.toggle('flipped', flipped);
            const toggle = document.getElementById('flip-toggle');
            if (toggle) toggle.textContent = flipped ? 'Hologram' : 'Oculus';
            if (flipped) {
                // Back face is now visible — start polling + prefill IP.
                startOculusPolls();
                prefillOculusIp();
            } else {
                stopOculusPolls();
                oculusMsg('');
            }
        }

        // A single pointerdown replaces the old separate mousedown + touchstart
        // listeners. On a touchscreen those two fire for the SAME tap
        // (touchstart, then an emulated mousedown), which used to dispatch
        // hologram_click TWICE — the first call started a turn and the second
        // hit _handle_interaction's interrupt branch and cancelled it, so a
        // tap "just cancelled" instead of listening. pointerdown fires exactly
        // once per physical press for mouse, touch, and pen.
        document.addEventListener('pointerdown', () => {
            hologramPress();
        }, { passive: true });

        // Dev keyboard shortcuts
        document.addEventListener('keydown', (ev) => {
            if (ev.key === 'F11') {
                ev.preventDefault();
                callApi('toggle_fullscreen');
            } else if (ev.key === 'Escape') {
                ev.preventDefault();
                callApi('exit_fullscreen');
            } else if (ev.key === ' ' || ev.key === 'Enter') {
                ev.preventDefault();
                hologramPress();
            }
        });

        // Suppress default context menu so right-clicks don't interfere.
        document.addEventListener('contextmenu', (ev) => ev.preventDefault());

        // ── Flip-card + oculus face wiring ─────────────────────────────
        // The flip toggle sits above both faces; stop the event so the
        // document pointerdown doesn't also fire hologramPress (which would
        // immediately flip back when showing the oculus face).
        document.getElementById('flip-toggle').addEventListener('pointerdown', (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
            flipCard();
        });

        // Clicks inside the oculus face must not bubble to the document
        // pointerdown — otherwise hologramPress() sees flipped===true and
        // flips back to the hologram before the button's own click fires.
        document.querySelector('.oculus-face').addEventListener('pointerdown', (ev) => {
            ev.stopPropagation();
        }, { passive: true });

        document.getElementById('oculus-open').addEventListener('click', async () => {
            oculusMsg('');
            const r = await apiPost('/api/oculus/open', {});
            if (r && r.ok) { pollOculusStatus(); }
            else { oculusMsg((r && r.error) || 'open failed'); }
        });
        document.getElementById('oculus-close').addEventListener('click', async () => {
            oculusMsg('');
            const r = await apiPost('/api/oculus/close', {});
            if (r && r.ok) { pollOculusStatus(); }
            else { oculusMsg((r && r.error) || 'close failed'); }
        });
        document.getElementById('oculus-alert-close').addEventListener('click', async () => {
            oculusMsg('');
            const r = await apiPost('/api/oculus/alert/close', {});
            if (r && r.ok) { pollOculusStatus(); }
            else { oculusMsg((r && r.error) || 'acknowledge failed'); }
        });
        document.getElementById('oculus-ip-save').addEventListener('click', async () => {
            const v = document.getElementById('oculus-ip').value.trim();
            if (!v) { oculusMsg('enter a host or IP'); return; }
            const r = await apiPost('/api/settings', { securitySatelliteIp: v });
            if (r && r.ok !== false) {
                oculusMsg('saved', true);
                // The frame server host just changed — re-poll so the feed
                // starts working immediately if the host was correct.
                pollOculusFrame();
                pollOculusStatus();
            } else {
                oculusMsg((r && r.error) || 'save failed');
            }
        });

        // ── Settings ─────────────────────────────────────────────────────
        // Settings (Warden URL, satellite host, widget show/hide) moved to the
        // Warden Dashboard window (panels.html).

        // pywebview readiness (only for logging; calls are guarded anyway)
        window.addEventListener('pywebviewready', () => {
            console.log('[jarvis] pywebview ready');
        });

        // Initial state
        setState('idle');
    </script>
</body>
</html>
