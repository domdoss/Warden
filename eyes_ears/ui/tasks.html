<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tasks & Projects</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none}

  .panel{
    width:100%;height:100%;position:relative;display:flex;flex-direction:column;
    background:radial-gradient(circle at 1px 1px, rgba(0,255,255,0.06) 1px, transparent 1px);
    background-size:20px 20px;background-color:rgba(0,10,20,0.88);
    border-radius:6px;overflow:hidden;
  }
  .panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;pointer-events:none;z-index:10}
  .panel::before{top:0;left:0;border-top:1.5px solid rgba(0,255,255,0.5);border-left:1.5px solid rgba(0,255,255,0.5)}
  .panel::after{bottom:0;right:0;border-bottom:1.5px solid rgba(0,255,255,0.5);border-right:1.5px solid rgba(0,255,255,0.5)}
  .br-tr,.br-bl{position:absolute;width:16px;height:16px;pointer-events:none;z-index:10}
  .br-tr{top:0;right:0;border-top:1.5px solid rgba(0,255,255,0.5);border-right:1.5px solid rgba(0,255,255,0.5)}
  .br-bl{bottom:0;left:0;border-bottom:1.5px solid rgba(0,255,255,0.5);border-left:1.5px solid rgba(0,255,255,0.5)}

  .header{padding:14px 16px 0;flex-shrink:0;display:flex;align-items:center;gap:10px}
  .header-icon{font-size:12px;color:#cc88ff;text-shadow:0 0 6px rgba(204,136,255,0.5)}
  .header-title{font-size:11px;font-weight:600;letter-spacing:2px;color:#cc88ff;text-shadow:0 0 8px rgba(204,136,255,0.4);text-transform:uppercase}
  .header-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(204,136,255,0.3),transparent)}
  .header-btn{font-size:12px;color:rgba(204,136,255,0.45);cursor:pointer;padding:2px 6px;border:1px solid rgba(204,136,255,0.2);border-radius:4px;line-height:1;transition:color 0.15s,border-color 0.15s,transform 0.4s;user-select:none}
  .header-btn:hover{color:#cc88ff;border-color:rgba(204,136,255,0.5)}
  .header-btn:active{transform:rotate(180deg)}
  .header-btn.add{font-size:8px;letter-spacing:1px;text-transform:uppercase;padding:3px 7px}
  .header-btn.add.busy{color:#ffaa00;border-color:rgba(255,170,0,0.4)}

  .tabs{display:flex;gap:0;padding:12px 16px 0;flex-shrink:0}
  .tab{padding:6px 14px;font-size:9px;font-weight:600;letter-spacing:1.5px;color:rgba(204,136,255,0.35);cursor:pointer;border-bottom:2px solid transparent;transition:color 0.2s,border-color 0.2s;text-transform:uppercase}
  .tab:hover{color:rgba(204,136,255,0.7)}
  .tab.active{color:#cc88ff;border-bottom-color:#cc88ff;text-shadow:0 0 6px rgba(204,136,255,0.4)}
  .tab .count{font-size:7px;opacity:0.5;margin-left:3px}

  .body{flex:1;padding:12px 14px;overflow-y:auto;min-height:0}
  .body::-webkit-scrollbar{width:3px}
  .body::-webkit-scrollbar-thumb{background:rgba(204,136,255,0.15);border-radius:2px}

  .item{position:relative;padding:8px 10px;margin-bottom:6px;border-radius:4px;background:rgba(204,136,255,0.03);border:1px solid rgba(204,136,255,0.08)}
  .item .it-title{font-size:10px;font-weight:600;color:#cc88ff;text-shadow:0 0 4px rgba(204,136,255,0.3);margin-bottom:3px;word-break:break-word;padding-right:14px}
  .item .it-sub{font-size:8px;font-family:'Courier New',monospace;color:rgba(204,136,255,0.4);line-height:1.4;word-break:break-word}
  .item .it-badge{display:inline-block;font-size:7px;padding:1px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px}
  .item .it-row{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
  .act-btn{font-size:7px;padding:2px 6px;border-radius:3px;cursor:pointer;letter-spacing:0.5px;text-transform:uppercase;
    background:rgba(204,136,255,0.06);border:1px solid rgba(204,136,255,0.18);color:rgba(204,136,255,0.6);transition:color .15s,border-color .15s}
  .act-btn:hover{color:#cc88ff;border-color:rgba(204,136,255,0.5)}
  .act-btn.del{color:rgba(255,68,68,0.6);border-color:rgba(255,68,68,0.2)}
  .act-btn.del:hover{color:#ff4444;border-color:rgba(255,68,68,0.5)}
  .act-btn.confirm{color:rgba(0,255,136,0.7);border-color:rgba(0,255,136,0.25)}
  .act-btn.confirm:hover{color:#00ff88;border-color:rgba(0,255,136,0.55)}
  /* Unconfirmed scanned items stand out so the user spots what needs a ✓/✕. */
  .item.unconfirmed{background:rgba(0,255,200,0.05);border:1px solid rgba(0,255,200,0.22);box-shadow:0 0 10px rgba(0,255,200,0.08)}
  .item.unconfirmed .it-title{color:#9ffece}
  .badge-unconfirmed{background:rgba(0,255,200,0.12);color:#00ffcc;border:1px solid rgba(0,255,200,0.3);animation:pulsef 2.4s ease-in-out infinite}
  @keyframes pulsef{0%,100%{opacity:1}50%{opacity:0.55}}
  .inbox-empty{text-align:center;padding:30px 20px;font-size:10px;color:rgba(204,136,255,0.25);font-family:'Courier New',monospace;line-height:1.6}
  .inbox-empty b{color:rgba(0,255,200,0.4);font-weight:400}
  .del-x{position:absolute;top:4px;right:5px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:rgba(255,68,68,0.35);cursor:pointer;border-radius:3px;line-height:1;transition:color .15s,background .15s;user-select:none}
  .del-x:hover{color:#ff4444;background:rgba(255,68,68,0.12)}
  .badge-active{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.2)}
  .badge-paused{background:rgba(255,170,0,0.1);color:#ffaa00;border:1px solid rgba(255,170,0,0.2)}
  .badge-done{background:rgba(0,255,255,0.06);color:rgba(0,255,255,0.5);border:1px solid rgba(0,255,255,0.15)}
  .badge-track{background:rgba(0,255,136,0.08);color:#00ff88;border:1px solid rgba(0,255,136,0.18)}
  .badge-risk{background:rgba(255,68,68,0.1);color:#ff4444;border:1px solid rgba(255,68,68,0.2)}

  .item.past{opacity:0.4}
  .item.past .it-title{color:rgba(204,136,255,0.5);text-shadow:none}
  .edit-row{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .edit-row label{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:rgba(204,136,255,0.4)}
  .edit-row input{background:rgba(0,20,40,0.6);border:1px solid rgba(204,136,255,0.25);border-radius:4px;color:#e8d8ff;font-size:9px;padding:5px 7px;outline:none;font-family:inherit}
  .edit-row input:focus{border-color:rgba(204,136,255,0.5)}
  .edit-row .edit-btns{display:flex;gap:5px;margin-top:3px}
  .empty{text-align:center;padding:40px 20px;font-size:10px;color:rgba(204,136,255,0.25);font-family:'Courier New',monospace}

  .new-row{display:none;gap:6px;padding:0 16px 10px;flex-shrink:0;flex-wrap:wrap}
  .new-row.show{display:flex}
  .new-row input{flex:1;min-width:0;background:rgba(0,20,40,0.6);border:1px solid rgba(204,136,255,0.25);border-radius:4px;color:#e8d8ff;font-size:10px;padding:6px 8px;outline:none;font-family:inherit}
  .new-row input#new-sched{flex:0 0 110px;font-family:'Courier New',monospace;font-size:9px}
  .new-row input:focus{border-color:rgba(204,136,255,0.5);box-shadow:0 0 8px rgba(204,136,255,0.1)}
  .new-row input::placeholder{color:rgba(204,136,255,0.2)}
  .new-row button{background:rgba(204,136,255,0.12);border:1px solid rgba(204,136,255,0.25);border-radius:4px;color:#cc88ff;font-size:8px;padding:6px 10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-weight:600}

  .footer{padding:6px 16px 10px;flex-shrink:0;text-align:right;font-size:7px;color:rgba(204,136,255,0.15);font-family:'Courier New',monospace;letter-spacing:0.5px}
</style>
</head>
<body>
<div class="panel">
  <div class="br-tr"></div><div class="br-bl"></div>
  <div class="header">
    <div class="header-icon">▣</div>
    <div class="header-title">Ops</div>
    <div class="header-line"></div>
    <div class="header-btn add" id="add-btn" title="New project">+ Project</div>
    <div class="header-btn" id="refresh-btn" title="Refresh">↻</div>
  </div>
  <div class="tabs">
    <div class="tab" data-tab="inbox">Inbox <span class="count" id="inbox-count"></span></div>
    <div class="tab active" data-tab="work">Work <span class="count" id="work-count"></span></div>
    <div class="tab" data-tab="reminders">Rem <span class="count" id="reminders-count"></span></div>
    <div class="tab" data-tab="tasks">Sched <span class="count" id="tasks-count"></span></div>
    <div class="tab" data-tab="calendar">Cal <span class="count" id="calendar-count"></span></div>
    <div class="tab" data-tab="projects">Proj <span class="count" id="projects-count"></span></div>
  </div>
  <div class="new-row" id="new-row">
    <input type="text" id="new-name" placeholder="New project name…" maxlength="200">
    <input type="text" id="new-sched" placeholder="cron e.g. 0 9 * * *" maxlength="40" style="display:none">
    <button id="new-create">Create</button>
  </div>
  <div class="body" id="body"><div class="empty">Loading…</div></div>
  <div class="footer" id="footer-ts">--</div>
</div>
<script>
(function(){
  // ── iframe postMessage bridge shim (see agents.html for full note) ──
  if(!window.pywebview && window.parent && window.parent !== window){
    var _pending={};
    window.addEventListener('message', function(ev){
      var d=ev.data; if(!d||!d.__pm||!d.id||!_pending[d.id])return;
      var p=_pending[d.id]; delete _pending[d.id]; clearTimeout(p.timer);
      if(d.error)p.reject(new Error(d.error)); else p.resolve(d.result);
    });
    window.pywebview={api:new Proxy({},{
      get:function(_,method){
        return function(){
          var args=Array.prototype.slice.call(arguments);
          return new Promise(function(resolve,reject){
            var id='pm-'+Math.random().toString(36).slice(2);
            var timer=setTimeout(function(){delete _pending[id];reject(new Error('bridge timeout: '+method));},30000);
            _pending[id]={resolve:resolve,reject:reject,timer:timer};
            window.parent.postMessage({__pm:true,id:id,method:method,args:args},'*');
          });
        };
      }
    })};
  }

  var body=document.getElementById('body'),footerTs=document.getElementById('footer-ts'),
      tabs=document.querySelectorAll('.tab'),activeTab='work',lastTasks=[],lastWork=[],lastProjects=[],lastCalendar=[],editingCalId=null;

  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

  function api(path,opts){
    opts=opts||{};
    return window.pywebview.api.warden_api(path,opts.method||'GET',opts.body||'');
  }

  async function load(){
    if(activeTab==='inbox') return loadInbox();
    if(activeTab==='calendar') return loadCalendar();
    if(activeTab==='tasks') return loadTasks();
    if(activeTab==='reminders') return loadReminders();
    if(activeTab==='work') return loadWork();
    return loadProjects();
  }

  // Calendar events (appointments) from /api/calendar/events — the local DB
  // calendar (Google-synced + scan-created). Confirmed scan events land here
  // after the user ✓-checks them in the Inbox. PAST events are shown too —
  // dimmed, below upcoming — so the calendar is a history, not just an agenda.
  // Each row has a red ✕ (delete → removes it from the calendar + this tab)
  // and an Edit button to change its date/time via the datetime pickers.
  async function loadCalendar(){
    try{
      var raw=await api('/api/calendar/events');
      var d=raw?JSON.parse(raw):null;
      var evs=((d&&d.events)||[]).filter(function(e){var t=e.start_time?new Date(e.start_time).getTime():NaN; return !Number.isNaN(t);});
      var now=Date.now();
      var future=evs.filter(function(e){return new Date(e.start_time).getTime()>=now;})
        .sort(function(a,b){return new Date(a.start_time)-new Date(b.start_time);});
      var past=evs.filter(function(e){return new Date(e.start_time).getTime()<now;})
        .sort(function(a,b){return new Date(b.start_time)-new Date(a.start_time);});
      var ordered=future.concat(past);
      lastCalendar=evs;
      document.getElementById('calendar-count').textContent=evs.length||'';
      if(!evs.length){body.innerHTML='<div class="empty">No calendar events.</div>';return;}
      body.innerHTML=ordered.map(function(e){
        var eid=e.id||e.uid||'';
        var isPast=new Date(e.start_time).getTime()<now;
        var st=e.start_time?fmtDT(e.start_time):'';
        var loc=e.location?(' · '+esc(e.location)):'';
        var src=e.calendar_source?(' · '+esc(e.calendar_source)):'';
        var end=e.end_time?(' → '+fmtDT(e.end_time)):'';
        var editHtml='';
        if(editingCalId===eid){
          editHtml='<div class="edit-row">'+
            '<label>Start</label><input type="datetime-local" id="cal-start" value="'+toLocalInput(e.start_time)+'">'+
            '<label>End</label><input type="datetime-local" id="cal-end" value="'+(e.end_time?toLocalInput(e.end_time):'')+'">'+
            '<label>Location</label><input type="text" id="cal-loc" value="'+esc(e.location||'').replace(/"/g,'&quot;')+'">'+
            '<div class="edit-btns"><span class="act-btn confirm" data-act="cal-save">Save</span>'+
            '<span class="act-btn" data-act="cal-cancel">Cancel</span></div>'+
          '</div>';
        }
        return '<div class="item'+(isPast?' past':'')+'" data-kind="calendar" data-id="'+esc(eid)+'">'+
          '<div class="del-x" data-act="del" title="Delete">✕</div>'+
          '<div class="it-title">'+esc(e.title)+'</div>'+
          '<div class="it-sub">'+esc(st)+end+loc+src+'</div>'+
          '<div class="it-row">'+
            (isPast?'<span class="it-badge badge-done">past</span>':'<span class="it-badge badge-active">upcoming</span>')+
            '<span class="act-btn" data-act="edit">Edit</span>'+
          '</div>'+
          editHtml+
        '</div>';
      }).join('');
    }catch(e){body.innerHTML='<div class="empty">Unable to load calendar.</div>'}
  }

  // Human-readable cron, matching the warden tasks tab (e.g. "0 9 * * *" →
  // "daily at 9am"). Falls back to the raw expression if it doesn't parse.
  function cronToHuman(c){
    if(!c)return '';
    var p=c.trim().split(/\s+/);
    if(p.length!==5)return c;
    var min=p[0],hr=p[1],dom=p[2],mon=p[3],dow=p[4];
    var at=function(h,m){var hh=(+h)%12||12;var mm=m&&m!=='0'?':'+String(m).replace(/^\*/,''):(+h?':00':'');return hh+(mm||'')+((+h||0)>=12?'pm':'am')};
    var day='';
    if(dow!=='*'){var D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var ds=dow.split(',');day=ds.length===1?D[+ds[0]]:'weekly '+ds.map(function(d){return D[+d]}).join('/');}
    if(dom!=='*'||mon!=='*')return c;
    if(min==='*'&&hr==='*')return 'every minute';
    if(min!=='*'&&hr!=='*')return (day?day+' ':'daily ')+(day?'at ':'')+at(hr,min);
    if(hr!=='*'&&min==='*')return (day||'hourly')+' at '+at(hr,'0');
    return c;
  }

  var digestTalkState={hourly:false,daily:false,weekly:false};
  async function loadDigestTalkState(){
    try{
      var raw=await api('/api/digest/config');
      var d=raw?JSON.parse(raw):null;
      digestTalkState={
        hourly:(d&&d.hourly&&d.hourly.talk)?true:false,
        daily:(d&&d.daily&&d.daily.talk)?true:false,
        weekly:(d&&d.weekly&&d.weekly.talk)?true:false
      };
    }catch(e){}
  }
  function spanFromTaskId(id){ return id.replace('iris-digest-',''); }
  function isDigestId(id){ return id.indexOf('iris-digest-')===0; }

  async function loadTasks(){
    await loadDigestTalkState();
    try{
      var raw=await api('/api/tasks');
      var d=raw?JSON.parse(raw):null;
      // Show every RECURRING scheduled job (cron + interval) — including the
      // internal Iris digest jobs (hourly/daily/weekly) and any heartbeat job —
      // so this tab is the direct view of Warden's recurring schedule. One-shot
      // "once" reminders live on the Reminders tab. System jobs get a clean
      // label instead of their raw stored prompt, and are guarded from deletion
      // (pause/resume still works).
      lastTasks=((d&&d.tasks)||[]).filter(function(t){return (t.schedule_type||'')!=='once';});
      document.getElementById('tasks-count').textContent=lastTasks.length||'';
      if(!lastTasks.length){body.innerHTML='<div class="empty">No scheduled tasks.</div>';return;}
      body.innerHTML=lastTasks.map(function(t){
        var badge=t.status==='active'?'badge-active':(t.status==='paused'?'badge-paused':'badge-done');
        var sched=t.schedule_type==='cron'?cronToHuman(t.schedule_value)
                 :t.schedule_type==='interval'?'every '+Math.round((+t.schedule_value)/60000)+'m'
                 :t.schedule_type==='once'?'once '+esc(t.schedule_value||''):'';
        var next=t.next_run?'next '+esc(new Date(t.next_run).toLocaleString()):'';
        var last=t.last_run?'last '+esc(new Date(t.last_run).toLocaleString())+
                 (t.last_result?(' · '+esc(String(t.last_result).slice(0,80))):''):'';
        var tog=t.status==='active'?['Pause','paused']:['Resume','active'];
        var tid=t.id||'',titleHtml,isSystem,isDigest;
        isSystem=tid.indexOf('iris-digest-')===0||tid.indexOf('heartbeat-')===0;
        isDigest=tid.indexOf('iris-digest-')===0;
        if(isDigest){titleHtml=esc('Iris '+tid.replace('iris-digest-','')+' digest');}
        else if(tid.indexOf('heartbeat-')===0){titleHtml='Heartbeat';}
        else{titleHtml=esc((t.prompt||'(no prompt)').slice(0,120))+((t.prompt||'').length>120?'…':'');}
        var talkBtn='';
        if(isDigest){
          var span=spanFromTaskId(tid);
          var talkOn=digestTalkState[span]||false;
          talkBtn='<span class="act-btn '+(talkOn?'confirm':'')+'" data-act="digest-talk" data-span="'+esc(span)+'" data-on="'+(!talkOn)+'">'+(talkOn?'🔊 Speak: ON':'🔊 Speak: off')+'</span>';
        }
        var cronInput='';
        if(isDigest){
          var span=spanFromTaskId(tid);
          cronInput='<div class="dg-sched" data-id="'+esc(tid)+'" data-span="'+esc(span)+'" style="margin-top:5px">'+renderDigestSched(span,t.schedule_value||'')+'</div>';
        }
        return '<div class="item" data-kind="task" data-id="'+esc(t.id)+'">'+
          (isSystem?'':'<div class="del-x" data-act="del" title="Delete">✕</div>')+
          '<div class="it-title">'+titleHtml+'</div>'+
          '<div class="it-sub">'+esc(sched)+(next?' · '+next:'')+'</div>'+
          (last?'<div class="it-sub">'+last+'</div>':'')+
          cronInput+
          '<div class="it-row">'+
            '<span class="it-badge '+badge+'">'+esc(t.status||'active')+'</span>'+
            '<span class="act-btn" data-act="toggle" data-status="'+tog[1]+'">'+tog[0]+'</span>'+
            talkBtn+
          '</div>'+
        '</div>';
      }).join('');
      // Wire the structured digest schedule inputs (minute / time / day) to
      // build a cron expression and PATCH /api/tasks/:id. No raw cron exposed.
      var dgScheds=body.querySelectorAll('.dg-sched');
      for(var di=0;di<dgScheds.length;di++){
        (function(box){
          var id=box.getAttribute('data-id'),span=box.getAttribute('data-span');
          var timer=null;
          var handler=function(){
            if(timer)clearTimeout(timer);
            timer=setTimeout(function(){
              var minEl=box.querySelector('.dg-min'),timeEl=box.querySelector('.dg-time'),dowEl=box.querySelector('.dg-dow');
              var min,hr,dow;
              if(span==='hourly'){ min=(minEl&&minEl.value)||'0'; hr='*'; dow='*'; }
              else{
                var tv=(timeEl&&timeEl.value)||'00:00',tp=tv.split(':');
                hr=tp[0]||'0'; min=tp[1]||'0'; dow=(span==='weekly'?((dowEl&&dowEl.value)||'0'):'*');
              }
              var cron=span==='hourly'?(min+' * * * *'):(span==='daily'?(min+' '+hr+' * * *'):(min+' '+hr+' * * '+dow));
              api('/api/tasks/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({schedule_value:cron})}).then(function(){
                box.style.borderColor='rgba(0,255,136,0.4)';
                setTimeout(function(){box.style.borderColor='';},600);
                loadTasks();
              })['catch'](function(){ box.style.borderColor='rgba(255,68,68,0.6)'; loadTasks(); });
            },800);
          };
          var flds=box.querySelectorAll('input,select');
          for(var fi=0;fi<flds.length;fi++){ flds[fi].addEventListener('input',handler); flds[fi].addEventListener('change',handler); }
        })(dgScheds[di]);
      }
    }catch(e){body.innerHTML='<div class="empty">Unable to load tasks.</div>'}
  }

  // ── Structured digest schedule controls (no raw cron shown) ──
  // Hourly → a minute (0-59) field. Daily → a time picker. Weekly → a day
  // dropdown + a time picker. The chosen values build a cron expression that
  // is saved via PATCH /api/tasks/:id; the row's subtitle shows the
  // human-readable form via cronToHuman() so the user never reads raw cron.
  function pad2(n){ n=String(n); return n.length<2?'0'+n:n; }
  function parseDigestCron(c){
    var p=(c||'').trim().split(/\s+/);
    if(p.length!==5) return {min:'0',hr:'0',dow:'0'};
    return {min:p[0],hr:p[1],dow:p[4]};
  }
  function renderDigestSched(span,cron){
    var p=parseDigestCron(cron),min=p.min,hr=p.hr,dow=p.dow;
    if(span==='hourly'){
      return '<label style="font-size:7px;letter-spacing:1px;text-transform:uppercase;color:rgba(204,136,255,0.4)">Minute past the hour</label>'+
        '<input type="number" min="0" max="59" class="dg-min" value="'+esc(min)+'" style="width:70px">';
    }
    var timeVal=pad2((+hr)%24)+':'+pad2(+min);
    if(span==='weekly'){
      var D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var opts='';
      for(var i=0;i<7;i++){ opts+='<option value="'+i+'"'+(String(dow)===String(i)?' selected':'')+'>'+D[i]+'</option>'; }
      return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'+
        '<div><label style="font-size:7px;letter-spacing:1px;text-transform:uppercase;color:rgba(204,136,255,0.4);display:block">Day</label>'+
        '<select class="dg-dow" style="background:rgba(0,20,40,0.6);border:1px solid rgba(204,136,255,0.25);color:#e8d8ff;font-size:9px;padding:4px 6px;border-radius:4px">'+opts+'</select></div>'+
        '<div><label style="font-size:7px;letter-spacing:1px;text-transform:uppercase;color:rgba(204,136,255,0.4);display:block">Time</label>'+
        '<input type="time" class="dg-time" value="'+timeVal+'" style="background:rgba(0,20,40,0.6);border:1px solid rgba(204,136,255,0.25);color:#e8d8ff;font-size:9px;padding:4px 6px;border-radius:4px"></div>'+
      '</div>';
    }
    // daily
    return '<label style="font-size:7px;letter-spacing:1px;text-transform:uppercase;color:rgba(204,136,255,0.4);display:block">Time of day</label>'+
      '<input type="time" class="dg-time" value="'+timeVal+'" style="background:rgba(0,20,40,0.6);border:1px solid rgba(204,136,255,0.25);color:#e8d8ff;font-size:9px;padding:4px 6px;border-radius:4px">';
  }

  // Reminders — one-shot schedule_type:'once' jobs (the things Dexter creates
  // when you say "remind me to … in 15 minutes"). Distinct from the Scheduled
  // tab, which lists recurring cron/interval automations. Each shows its fire
  // time and can be paused/resumed or deleted (handled by the existing task
  // delegation since data-kind="task").
  async function loadReminders(){
    try{
      var raw=await api('/api/tasks');
      var d=raw?JSON.parse(raw):null;
      var rems=((d&&d.tasks)||[]).filter(function(t){return (t.schedule_type||'')==='once';});
      document.getElementById('reminders-count').textContent=rems.length||'';
      if(!rems.length){body.innerHTML='<div class="empty">No reminders. Use “+ Reminder” to add one, or tell Jarvis “remind me to…”.</div>';return;}
      body.innerHTML=rems.map(function(t){
        var badge=t.status==='active'?'badge-active':(t.status==='paused'?'badge-paused':'badge-done');
        var when=t.schedule_value?('fires '+esc(new Date(t.schedule_value).toLocaleString())):'';
        var tog=t.status==='active'?['Pause','paused']:['Resume','active'];
        var title=esc((t.prompt||'(no prompt)').slice(0,120))+((t.prompt||'').length>120?'…':'');
        return '<div class="item" data-kind="task" data-id="'+esc(t.id)+'">'+
          '<div class="del-x" data-act="del" title="Delete">✕</div>'+
          '<div class="it-title">'+title+'</div>'+
          (when?'<div class="it-sub">'+when+'</div>':'')+
          '<div class="it-row">'+
            '<span class="it-badge '+badge+'">'+esc(t.status||'active')+'</span>'+
            '<span class="act-btn" data-act="toggle" data-status="'+tog[1]+'">'+tog[0]+'</span>'+
          '</div>'+
        '</div>';
      }).join('');
    }catch(e){body.innerHTML='<div class="empty">Unable to load reminders.</div>'}
  }

  // Work tasks — the to-dos Byte creates (user_work_tasks). Distinct from the
  // Scheduled tab, which lists cron/interval jobs. /api/work-tasks returns raw
  // tasks keyed by project_id, so we also pull /api/projects to show the
  // project name. Tasks with no project live in the permanent Personal project.
  async function loadWork(){
    try{
      var raw=await api('/api/work-tasks');
      var d=raw?JSON.parse(raw):null;
      var tasks=(d&&d.tasks)||[];
      var projMap={};
      try{var praw=await api('/api/projects');var pd=praw?JSON.parse(praw):null;
        ((pd&&pd.projects)||[]).forEach(function(p){projMap[p.id]=p.name;});}catch(e){}
      lastWork=tasks;
      document.getElementById('work-count').textContent=tasks.length||'';
      if(!tasks.length){body.innerHTML='<div class="empty">No work tasks. Use “+ Work Task” to add one.</div>';return;}
      body.innerHTML=tasks.map(function(t){
        var st=t.status||'open';
        var badge=/complet|done|closed/i.test(st)?'badge-done':/block/i.test(st)?'badge-risk':
                 /progress/i.test(st)?'badge-track':/pause/i.test(st)?'badge-paused':'badge-active';
        var proj=projMap[t.project_id]||(t.project_id?esc(t.project_id):'Personal');
        var due=t.due_date?(' · due '+esc(t.due_date.slice(0,10))):'';
        var pri=esc(t.priority||'medium');
        return '<div class="item" data-kind="worktask" data-id="'+esc(t.id)+'">'+
          '<div class="del-x" data-act="del" title="Delete">✕</div>'+
          '<div class="it-title">'+esc(t.title)+'</div>'+
          '<div class="it-sub">'+esc(proj)+' · '+pri+' priority'+due+'</div>'+
          '<div class="it-row"><span class="it-badge '+badge+'">'+esc(st)+'</span></div>'+
        '</div>';
      }).join('');
    }catch(e){body.innerHTML='<div class="empty">Unable to load work tasks.</div>'}
  }

  async function loadProjects(){
    try{
      var raw=await api('/api/projects');
      var d=raw?JSON.parse(raw):null;
      lastProjects=(d&&d.projects)||[];
      document.getElementById('projects-count').textContent=lastProjects.length||'';
      if(!lastProjects.length){body.innerHTML='<div class="empty">No projects. Use “+ Project” to add one.</div>';return;}
      var today=new Date().toISOString().slice(0,10);
      body.innerHTML=lastProjects.map(function(p){
        var st=esc(p.status||'On Track');
        var badge=/risk|delay|block/i.test(st)?'badge-risk':/complet/i.test(st)?'badge-done':'badge-track';
        var due=p.due_date?esc(p.due_date.slice(0,10)):'';
        var overdue=due&&due<today&&!/complet/i.test(st);
        var prog=p.progress!=null?(+p.progress)+'%':'';
        var meta=[p.project_code?esc(p.project_code):'',due?(overdue?'OVERDUE ':'due ')+due:'',prog].filter(Boolean).join(' · ');
        var desc=p.description?'<div class="it-sub">'+esc(p.description).slice(0,140)+'</div>':'';
        var dels=(p.deliverables||[]),deldone=dels.filter(function(x){return x.done}).length;
        var delLine=dels.length?('<div class="it-sub">'+deldone+'/'+dels.length+' deliverables</div>'):'';
        return '<div class="item" data-kind="project" data-id="'+esc(p.id)+'">'+
          '<div class="del-x" data-act="del" title="Delete">✕</div>'+
          '<div class="it-title">'+esc(p.name)+'</div>'+
          desc+
          (meta?'<div class="it-sub"'+(overdue?' style="color:#ff4444"':'')+'>'+meta+'</div>':'')+
          delLine+
          '<div class="it-row"><span class="it-badge '+badge+'">'+st+'</span></div>'+
        '</div>';
      }).join('');
    }catch(e){body.innerHTML='<div class="empty">Unable to load projects.</div>'}
  }

  // ── Inbox ── unconfirmed scanned items (work tasks + calendar events) that
  // the Actionable scanner dropped into the real stores with confirmed=0. They
  // stand out here so the user can green-check (✓ confirm → confirmed=1, stays in
  // the table, graduates out of the Inbox).
  function fmtDT(iso){
    if(!iso) return '';
    try{ var d=new Date(iso); if(isNaN(d)) return esc(iso);
      return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return esc(iso); }
  }
  // Convert a stored ISO/UTC timestamp to the local "YYYY-MM-DDTHH:MM" value an
  // <input type="datetime-local"> expects (no timezone), for editing an event.
  function toLocalInput(iso){
    var d=new Date(iso); if(isNaN(d))return '';
    var p=function(n){return String(n).padStart(2,'0')};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }
  async function loadInbox(){
    try{
      var raw=await api('/api/scan/inbox');
      var st=raw?JSON.parse(raw):null;
      var tasks=(st&&st.tasks)||[], events=(st&&st.events)||[];
      var n=tasks.length+events.length;
      document.getElementById('inbox-count').textContent=n||'';
      if(!n){
        body.innerHTML='<div class="inbox-empty">Inbox clear — no items awaiting review.<br><br>Scanned tasks &amp; events land here <b>unconfirmed</b> for a ✓.<br>Run a scan from the digest Actionable tab.</div>';
        return;
      }
      var h='';
      tasks.forEach(function(t){
        h+='<div class="item unconfirmed" data-kind="inbox-task" data-id="'+esc(t.id)+'">'
          +'<div class="it-title">'+esc(t.title)+'</div>'
          +'<div class="it-sub">'+esc(t.due_date?('due '+fmtDT(t.due_date)):'to-do')+(t.description?(' · '+esc(t.description).slice(0,80)):'')+'</div>'
          +'<div class="it-row"><span class="it-badge badge-unconfirmed">unconfirmed · task</span>'
          +'<span class="act-btn deny" data-act="deny" title="Dismiss this item">✕ Deny</span>'
          +'<span class="act-btn confirm" data-act="confirm" title="Confirm">✓ Confirm</span></div>'
          +'</div>';
      });
      events.forEach(function(e){
        h+='<div class="item unconfirmed" data-kind="inbox-event" data-id="'+esc(e.id)+'">'
          +'<div class="it-title">'+esc(e.title)+'</div>'
          +'<div class="it-sub">'+esc(fmtDT(e.start_time))+(e.end_time?(' → '+esc(fmtDT(e.end_time))):'')+(e.location?(' · '+esc(e.location)):'')+'</div>'
          +'<div class="it-row"><span class="it-badge badge-unconfirmed">unconfirmed · event</span>'
          +'<span class="act-btn deny" data-act="deny" title="Dismiss this item">✕ Deny</span>'
          +'<span class="act-btn confirm" data-act="confirm" title="Confirm">✓ Confirm</span></div>'
          +'</div>';
      });
      body.innerHTML=h;
    }catch(e){body.innerHTML='<div class="empty">Unable to load inbox.</div>'}
  }
  // Always refresh the Inbox count badge so the user sees pending review items
  // even from another tab. Skipped when the Inbox tab is active (loadInbox just
  // set it) to avoid a double fetch.
  async function refreshInboxCount(){
    if(activeTab==='inbox') return;
    try{
      var raw=await api('/api/scan/inbox');
      var st=raw?JSON.parse(raw):null;
      var n=((st&&st.tasks)||[]).length+((st&&st.events)||[]).length;
      document.getElementById('inbox-count').textContent=n||'';
    }catch(e){}
  }
  async function confirmInboxItem(kind,id){
    try{
      var raw=await api('/api/scan/confirm',{method:'POST',body:JSON.stringify({kind:kind,id:id})});
      var r=raw?JSON.parse(raw):null;
      if(!r||!r.ok) return;
    }catch(e){}
    await loadInbox();
  }
  async function delInboxItem(kind,id){
    var ep=kind==='inbox-event'?('/api/calendar/events/'+encodeURIComponent(id)):('/api/work-tasks/'+encodeURIComponent(id));
    try{ await api(ep,{method:'DELETE'}); }catch(e){}
    await loadInbox();
  }

  async function createProject(name){
    var addBtn=document.getElementById('add-btn');
    addBtn.classList.add('busy');addBtn.textContent='Working…';
    try{
      var raw=await api('/api/projects',{method:'POST',body:JSON.stringify({name:name})});
      var d=raw?JSON.parse(raw):null;
      if(d&&d.ok){document.getElementById('new-row').classList.remove('show');document.getElementById('new-name').value='';await loadProjects();}
      else body.innerHTML='<div class="empty">'+esc((d&&d.error)||'Create failed')+'</div>';
    }catch(e){body.innerHTML='<div class="empty">Create failed.</div>'}
    finally{addBtn.classList.remove('busy');setAddMode(activeTab);}
  }

  async function createTask(prompt,cron){
    var addBtn=document.getElementById('add-btn');
    addBtn.classList.add('busy');addBtn.textContent='Working…';
    try{
      var raw=await api('/api/tasks',{method:'POST',body:JSON.stringify({
        prompt:prompt,schedule_type:'cron',schedule_value:cron||'0 9 * * *',
        chat_jid:'owner@local',context_mode:'isolated'
      })});
      var d=raw?JSON.parse(raw):null;
      if(d&&d.id){document.getElementById('new-row').classList.remove('show');
        document.getElementById('new-name').value='';document.getElementById('new-sched').value='';
        await loadTasks();}
      else body.innerHTML='<div class="empty">'+esc((d&&d.error)||'Create failed')+'</div>';
    }catch(e){body.innerHTML='<div class="empty">Create failed.</div>'}
    finally{addBtn.classList.remove('busy');setAddMode(activeTab);}
  }

  // A reminder is a one-shot 'once' task: schedule_value is an absolute LOCAL
  // timestamp "YYYY-MM-DDTHH:MM:SS". The datetime-local input yields
  // "YYYY-MM-DDTHH:MM" (local), so append ":00".
  async function createReminder(prompt,when){
    var addBtn=document.getElementById('add-btn');
    addBtn.classList.add('busy');addBtn.textContent='Working…';
    try{
      var sv=when?when+':00':'';
      var raw=await api('/api/tasks',{method:'POST',body:JSON.stringify({
        prompt:prompt,schedule_type:'once',schedule_value:sv,
        chat_jid:'owner@local',context_mode:'isolated'
      })});
      var d=raw?JSON.parse(raw):null;
      if(d&&d.id){document.getElementById('new-row').classList.remove('show');
        document.getElementById('new-name').value='';document.getElementById('new-sched').value='';
        await loadReminders();}
      else body.innerHTML='<div class="empty">'+esc((d&&d.error)||'Create failed')+'</div>';
    }catch(e){body.innerHTML='<div class="empty">Create failed.</div>'}
    finally{addBtn.classList.remove('busy');setAddMode(activeTab);}
  }

  async function createWorkTask(title){
    var addBtn=document.getElementById('add-btn');
    addBtn.classList.add('busy');addBtn.textContent='Working…';
    try{
      var raw=await api('/api/work-tasks',{method:'POST',body:JSON.stringify({title:title})});
      var d=raw?JSON.parse(raw):null;
      if(d&&d.ok){document.getElementById('new-row').classList.remove('show');document.getElementById('new-name').value='';await loadWork();}
      else body.innerHTML='<div class="empty">'+esc((d&&d.error)||'Create failed')+'</div>';
    }catch(e){body.innerHTML='<div class="empty">Create failed.</div>'}
    finally{addBtn.classList.remove('busy');setAddMode(activeTab);}
  }

  // The header "+" button is context-aware: "New Schedule" on the Sched tab
  // (opens a prompt + cron row), "+ Project" on the Projects tab (name row).
  // The schedule input is shown only for schedules.
  function setAddMode(tab){
    var addBtn=document.getElementById('add-btn');
    var sched=document.getElementById('new-sched');
    var name=document.getElementById('new-name');
    addBtn.style.display='';
    if(tab==='inbox'){
      addBtn.style.display='none';
    }else if(tab==='tasks'){
      addBtn.textContent='New Schedule';addBtn.title='New schedule';
      name.placeholder='New schedule prompt…';sched.type='text';sched.style.display='';
    }else if(tab==='reminders'){
      addBtn.textContent='New Reminder';addBtn.title='New reminder';
      name.placeholder='Reminder prompt…';sched.type='datetime-local';sched.style.display='';
    }else if(tab==='work'){
      addBtn.textContent='+ Work Task';addBtn.title='New work task';
      name.placeholder='New work task…';sched.style.display='none';
    }else{
      addBtn.textContent='+ Project';addBtn.title='New project';
      name.placeholder='New project name…';sched.style.display='none';
    }
  }

  function commitNew(){
    var n=document.getElementById('new-name').value.trim();
    if(!n)return;
    if(activeTab==='tasks')createTask(n,document.getElementById('new-sched').value.trim());
    else if(activeTab==='reminders')createReminder(n,document.getElementById('new-sched').value.trim());
    else if(activeTab==='work')createWorkTask(n);
    else createProject(n);
  }

  tabs.forEach(function(t){
    t.addEventListener('click',function(){
      tabs.forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      activeTab=t.dataset.tab;
      setAddMode(activeTab);
      document.getElementById('new-row').classList.toggle('show',false);
      load();
    });
  });

  document.getElementById('refresh-btn').addEventListener('click',load);

  document.getElementById('add-btn').addEventListener('click',function(){
    var row=document.getElementById('new-row');
    row.classList.toggle('show');
    if(row.classList.contains('show'))document.getElementById('new-name').focus();
  });
  document.getElementById('new-create').addEventListener('click',commitNew);
  document.getElementById('new-name').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){ev.preventDefault();commitNew();}
  });
  document.getElementById('new-sched').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){ev.preventDefault();commitNew();}
  });
  setAddMode(activeTab);

  // Event delegation for the red-X delete buttons and the Pause/Resume toggle
  // on tasks. Items are re-rendered via innerHTML, so we listen on the body
  // container and inspect the closest [data-act].
  async function delTask(id){
    try{await api('/api/tasks/'+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
    await loadTasks();
  }
  async function delProject(id){
    try{await api('/api/projects/'+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
    await loadProjects();
  }
  async function delWorkTask(id){
    try{await api('/api/work-tasks/'+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
    await loadWork();
  }
  async function delCalendarEvent(id){
    try{await api('/api/calendar/events/'+encodeURIComponent(id),{method:'DELETE'});}catch(e){}
    await loadCalendar();
  }
  // Save an in-place edit of a calendar event's start/end/location. The
  // datetime pickers yield local "YYYY-MM-DDTHH:MM"; convert to ISO for the PUT.
  // An empty End clears the end time. The 15s tick is paused while editing
  // (see tick()) so the half-filled pickers aren't wiped mid-edit.
  async function saveCalendarEvent(id){
    var start=document.getElementById('cal-start').value;
    var end=document.getElementById('cal-end').value;
    var loc=document.getElementById('cal-loc').value;
    if(!start){editingCalId=null;await loadCalendar();return;}
    var body={start_time:new Date(start).toISOString(),location:loc||''};
    body.end_time=end?new Date(end).toISOString():'';
    try{await api('/api/calendar/events/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});}catch(e){}
    editingCalId=null;
    await loadCalendar();
  }
  async function toggleTask(id,status){
    try{
      await api('/api/tasks/'+encodeURIComponent(id),{method:'PATCH',
        body:JSON.stringify({status:status})});
    }catch(e){}
    await loadTasks();
  }
  body.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-act]'); if(!el)return;
    var item=el.closest('.item'); if(!item)return;
    var kind=item.getAttribute('data-kind'),id=item.getAttribute('data-id'),act=el.getAttribute('data-act');
    if(act==='del'){
      if(kind==='project'){if(confirm('Delete this project?'))delProject(id);}
      else if(kind==='worktask'){delWorkTask(id);}
      else if(kind==='calendar'){delCalendarEvent(id);}
      else delTask(id);
    }else if(act==='deny'){
      // Inbox ✕ — dismiss a scanned item (delete the row).
      delInboxItem(kind,id);
    }else if(act==='confirm'){
      // Inbox ✓ — confirm a scanned task/event (flip confirmed=1).
      var ck=kind==='inbox-event'?'event':'task';
      confirmInboxItem(ck,id);
    }else if(act==='toggle'){
      toggleTask(id,el.getAttribute('data-status'));
    }else if(act==='digest-talk'){
      var span=el.getAttribute('data-span');
      var on=el.getAttribute('data-on')==='true';
      var payload={}; payload[span]={talk:on};
      api('/api/digest/config',{method:'POST',body:JSON.stringify(payload)}).then(loadTasks,loadTasks);
    }else if(act==='edit'&&kind==='calendar'){
      // Expand the inline datetime pickers for this event.
      editingCalId=id; loadCalendar();
    }else if(act==='cal-save'){
      saveCalendarEvent(id);
    }else if(act==='cal-cancel'){
      editingCalId=null; loadCalendar();
    }
  });

  async function tick(){
    // Don't auto-refresh while a calendar event is being edited — the 15s tick
    // would re-render and wipe the half-filled datetime pickers.
    if(editingCalId==null) await load();
    refreshInboxCount();
    footerTs.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }
  tick();
  setInterval(tick,15000);
})();
</script>
</body>
