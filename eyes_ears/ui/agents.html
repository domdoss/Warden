<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agents</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none}

  .panel{
    width:100%;height:100%;position:relative;display:flex;flex-direction:column;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,255,255,0.06) 1px, transparent 1px);
    background-size: 20px 20px;
    background-color: rgba(0,10,20,0.88);
    border-radius: 6px;overflow:hidden;
  }
  .panel::before,.panel::after{
    content:'';position:absolute;width:16px;height:16px;pointer-events:none;z-index:10;
  }
  .panel::before{top:0;left:0;border-top:1.5px solid rgba(0,255,255,0.5);border-left:1.5px solid rgba(0,255,255,0.5)}
  .panel::after{bottom:0;right:0;border-bottom:1.5px solid rgba(0,255,255,0.5);border-right:1.5px solid rgba(0,255,255,0.5)}
  .br-tr,.br-bl{position:absolute;width:16px;height:16px;pointer-events:none;z-index:10}
  .br-tr{top:0;right:0;border-top:1.5px solid rgba(0,255,255,0.5);border-right:1.5px solid rgba(0,255,255,0.5)}
  .br-bl{bottom:0;left:0;border-bottom:1.5px solid rgba(0,255,255,0.5);border-left:1.5px solid rgba(0,255,255,0.5)}

  /* ── header ── */
  .header{
    padding:8px 130px 0 14px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  }
  .header-dot{
    width:8px;height:8px;border-radius:50%;background:#00ff88;
    box-shadow:0 0 6px rgba(0,255,136,0.6);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:0.3}
  }
  .header-title{
    font-size:14px;font-weight:600;letter-spacing:2px;color:#00ff88;
    text-shadow:0 0 8px rgba(0,255,136,0.4);text-transform:uppercase;
  }
  .header-count{
    font-size:11px;font-family:'Courier New',monospace;color:rgba(0,255,136,0.5);
    margin-left:auto;
  }
  .header-line{
    flex:1;height:1px;background:linear-gradient(90deg,rgba(0,255,136,0.3),transparent);
  }
  .header-btn{
    font-size:12px;color:rgba(0,255,136,0.45);cursor:pointer;padding:2px 6px;
    border:1px solid rgba(0,255,136,0.2);border-radius:4px;line-height:1;
    transition:color 0.15s,border-color 0.15s,transform 0.4s;user-select:none;
  }
  .header-btn:hover{color:#00ff88;border-color:rgba(0,255,136,0.5)}
  .header-btn:active{transform:rotate(180deg)}

  /* ── agent list ── */
  .agent-list{
    flex:1;display:flex;flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden;
    padding:6px 10px;align-items:stretch;scrollbar-width:thin;
    scrollbar-color:rgba(0,255,255,0.15) transparent;
  }
  .agent-list::-webkit-scrollbar{height:4px}
  .agent-list::-webkit-scrollbar-thumb{background:rgba(0,255,255,0.15);border-radius:2px}

  .agent-card{
    flex:1 1 165px;min-width:150px;display:flex;flex-direction:column;align-items:stretch;
    gap:7px;padding:11px 13px;
    border-radius:4px;background:rgba(0,255,255,0.03);
    border:1px solid rgba(0,255,255,0.08);
    transition:border-color 0.3s ease,background 0.3s ease;
  }
  .agent-top{display:flex;align-items:center;gap:6px}
  .agent-top .agent-name{flex:1;min-width:0;margin:0}
  .agent-activity{flex:1 1 auto;overflow:hidden}
  .agent-card.active{border-color:rgba(0,255,136,0.3);background:rgba(0,255,136,0.04)}
  .agent-card.idle-pending{border-color:rgba(255,170,0,0.2);background:rgba(255,170,0,0.03)}

  .agent-icon{
    font-size:24px;width:26px;text-align:center;flex-shrink:0;
    text-shadow:0 0 6px currentColor;
  }

  .status-dot{
    width:11px;height:11px;border-radius:50%;flex-shrink:0;
    background:rgba(255,255,255,0.15);
    box-shadow:none;transition:all 0.3s ease;
  }
  .status-dot.active{
    background:#00ff88;
    box-shadow:0 0 8px rgba(0,255,136,0.6);
    animation:pulse 1.5s ease-in-out infinite;
  }
  .status-dot.idle-pending{
    background:#ffaa00;
    box-shadow:0 0 6px rgba(255,170,0,0.4);
  }

  .agent-info{flex:1;min-width:0}
  .agent-name{
    font-size:15px;font-weight:600;color:#00ffff;
    text-shadow:0 0 4px rgba(0,255,255,0.3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .agent-channel{
    font-size:9px;text-transform:uppercase;letter-spacing:1px;
    color:rgba(0,255,255,0.25);margin-bottom:4px;
  }
  .agent-activity{
    font-size:12px;font-family:'Courier New',monospace;
    color:rgba(0,255,255,0.5);line-height:1.4;
    word-break:break-word;
  }
  .agent-tools{
    display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;
  }
  .tool-tag{
    font-size:9px;padding:2px 7px;border-radius:2px;
    background:rgba(0,255,255,0.08);color:rgba(0,255,255,0.4);
    border:1px solid rgba(0,255,255,0.12);
    text-transform:uppercase;letter-spacing:0.5px;
  }
  .phase-badge{
    display:inline-block;font-size:9px;padding:2px 8px;border-radius:2px;
    background:rgba(255,170,0,0.1);color:#ffaa00;
    border:1px solid rgba(255,170,0,0.2);
    text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;
  }
  .badge-row{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap}

  .empty{
    text-align:center;padding:40px 20px;
    font-size:10px;color:rgba(0,255,255,0.25);
    font-family:'Courier New',monospace;
  }

  /* ── footer ── */
  .footer{
    padding:6px 16px 10px;flex-shrink:0;text-align:right;
    font-size:7px;color:rgba(0,255,255,0.15);
    font-family:'Courier New',monospace;letter-spacing:0.5px;
  }

  /* ── per-agent model popover ── */
  .popover-overlay{
    position:absolute;inset:0;background:rgba(0,5,12,0.78);
    display:none;align-items:flex-start;justify-content:center;z-index:50;
    backdrop-filter:blur(2px);padding:6px;overflow:hidden;
  }
  .popover-overlay.open{display:flex}
  .popover{
    width:300px;max-width:100%;max-height:100%;overflow-y:auto;
    background:rgba(0,18,32,0.98);
    border:1px solid rgba(0,255,136,0.35);border-radius:6px;
    box-shadow:0 0 24px rgba(0,255,136,0.18);padding:14px 14px 12px;
    position:relative;
  }
  .popover::before,.popover::after{
    content:'';position:absolute;width:12px;height:12px;pointer-events:none;
  }
  .popover::before{top:-1px;left:-1px;border-top:1.5px solid #00ff88;border-left:1.5px solid #00ff88}
  .popover::after{bottom:-1px;right:-1px;border-bottom:1.5px solid #00ff88;border-right:1.5px solid #00ff88}
  .pop-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .pop-head .pop-icon{font-size:18px;text-shadow:0 0 6px currentColor}
  .pop-head .pop-name{font-size:13px;font-weight:600;letter-spacing:1.5px;
    color:#00ff88;text-shadow:0 0 6px rgba(0,255,136,0.4);text-transform:uppercase;flex:1}
  .pop-close{font-size:14px;color:rgba(0,255,136,0.45);cursor:pointer;
    border:1px solid rgba(0,255,136,0.2);border-radius:4px;width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;line-height:1;transition:color 0.15s,border-color 0.15s}
  .pop-close:hover{color:#00ff88;border-color:rgba(0,255,136,0.5)}
  .pop-field{margin-bottom:11px}
  .pop-field label{display:block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(0,255,136,0.5);margin-bottom:4px}
  .pop-field select{
    width:100%;background:rgba(0,30,50,0.7);border:1px solid rgba(0,255,255,0.22);
    border-radius:4px;color:#cfefff;font-size:11px;padding:6px 8px;outline:none;
    font-family:inherit;cursor:pointer;
  }
  .pop-field select:focus{border-color:rgba(0,255,136,0.5);box-shadow:0 0 8px rgba(0,255,136,0.12)}
  .pop-field select option{background:#001828;color:#cfefff}
  .pop-status{font-size:9px;min-height:12px;margin-bottom:8px;letter-spacing:0.5px;
    font-family:'Courier New',monospace}
  .pop-status.ok{color:rgba(0,255,136,0.7)}
  .pop-status.err{color:#ff6b6b}
  .pop-status.busy{color:#ffaa00}
  .pop-actions{display:flex;gap:8px;justify-content:flex-end}
  .pop-btn{
    font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;
    padding:7px 14px;border-radius:4px;cursor:pointer;font-family:inherit;
    border:1px solid rgba(0,255,136,0.3);background:rgba(0,255,136,0.08);color:#00ff88;
    transition:background 0.15s,opacity 0.15s;
  }
  .pop-btn:hover{background:rgba(0,255,136,0.18)}
  .pop-btn:disabled{opacity:0.35;cursor:default}
  .pop-btn.ghost{background:transparent;border-color:rgba(0,255,255,0.2);color:rgba(0,255,255,0.5)}
  .pop-btn.ghost:hover{background:rgba(0,255,255,0.08)}
</style>
</head>
<body>
<div class="panel">
  <div class="br-tr"></div><div class="br-bl"></div>
  <div class="header">
    <div class="header-dot"></div>
    <div class="header-title">Agents</div>
    <div class="header-line"></div>
    <div class="header-count" id="agent-count">--</div>
  </div>
  <div class="agent-list" id="agent-list">
    <div class="empty">No agents registered.</div>
  </div>
  <div class="footer" id="footer-ts">--</div>
  <!-- per-agent model + ctx popover (click a card to open) -->
  <div class="popover-overlay" id="pop-overlay">
    <div class="popover" id="popover">
      <div class="pop-head">
        <div class="pop-icon" id="pop-icon">●</div>
        <div class="pop-name" id="pop-name">Agent</div>
        <div class="pop-close" id="pop-close" title="Close">×</div>
      </div>
      <div class="pop-field">
        <label>Model</label>
        <select id="pop-model"></select>
      </div>
      <div class="pop-field">
        <label>Context (num_ctx)</label>
        <select id="pop-ctx"></select>
      </div>
      <div class="pop-status" id="pop-status"></div>
      <div class="pop-actions">
        <button class="pop-btn ghost" id="pop-cancel">Close</button>
        <button class="pop-btn" id="pop-save">Save</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  // ── iframe postMessage bridge shim ──
  // When this panel runs inside the panels.html host (a cross-origin file://
  // iframe), window.pywebview is absent. Build a proxy that forwards api
  // calls to the parent via postMessage and awaits the result. No-op when
  // the panel runs as its own top-level window (pywebview injects the bridge).
  if(!window.pywebview && window.parent && window.parent !== window){
    var _pending={};
    window.addEventListener('message', function(ev){
      var d=ev.data; if(!d||!d.__pm||!d.id||!_pending[d.id])return;
      var p=_pending[d.id]; delete _pending[d.id]; clearTimeout(p.timer);
      if(d.error)p.reject(new Error(d.error)); else p.resolve(d.result);
    });
    window.pywebview={api:new Proxy({},{
      get:function(_,method){
        return function(){
          var args=Array.prototype.slice.call(arguments);
          return new Promise(function(resolve,reject){
            var id='pm-'+Math.random().toString(36).slice(2);
            var timer=setTimeout(function(){delete _pending[id];reject(new Error('bridge timeout: '+method));},30000);
            _pending[id]={resolve:resolve,reject:reject,timer:timer};
            window.parent.postMessage({__pm:true,id:id,method:method,args:args},'*');
          });
        };
      }
    })};
  }

  var AGENT_COLORS={
    orchestrator:'#ffaa00',
    iris:'#ff66aa',
    atlas:'#00ff88',
    dexter:'#00ccff',
    byte:'#cc88ff',
    mercury:'#c8d4e0',
    sentry:'#ff4444',
    artemis:'#ff8800',
    vulkan:'#ff6600',
    council:'#00ccff',
    tool:'#00ffff',
    thinking:'#8888ff'
  };
  var AGENT_ICONS={
    orchestrator:'⬡',
    iris:'✉',
    atlas:'⚡',
    dexter:'📅',
    byte:'📋',
    mercury:'☿',
    sentry:'🛡',
    artemis:'🔍',
    vulkan:'🔧'
  };
  // The fixed Warden roster — always shown as cards even when idle, so the
  // panel reads as a full team rather than only the agent with recent history.
  // Live status (active/idle + label) is layered on top from progress + the
  // live group phase below.
  var KNOWN_AGENTS=[
    {key:'orchestrator',name:'Orchestrator',channel:'owner'},
    {key:'iris',name:'Iris',channel:'email'},
    {key:'atlas',name:'Atlas',channel:'research'},
    {key:'dexter',name:'Dexter',channel:'calendar'},
    {key:'byte',name:'Byte',channel:'notes'},
    {key:'mercury',name:'Mercury',channel:'memory'},
    {key:'artemis',name:'Artemis',channel:'browser'},
    {key:'sentry',name:'Sentry',channel:'security'},
    {key:'vulkan',name:'Vulkan',channel:'build'}
  ];

  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

  function renderAgents(progress, groups, livePhase, liveLabel, liveTools){
    var list=document.getElementById('agent-list');
    var count=document.getElementById('agent-count');
    var now=Date.now();

    // Build agent cards — one card per unique agent. Active state is derived
    // from the live group's livePhase (the actual current phase) and from the
    // `jobs` field on each agent's most-recent progress event (jobs>0 = running).
    // Progress events are HISTORY, so we never infer "active" from kind alone —
    // a stale "atlas: iteration 13" status line lingers after atlas finishes.
    var seen={};
    var cards=[];

    // Seed the full fixed roster first so every Warden agent always has a
    // card. These start idle; live status is layered on below.
    KNOWN_AGENTS.forEach(function(a){
      seen[a.key]=true;
      cards.push({
        key:a.key,
        name:a.name,
        channel:a.channel,
        isMain:a.key==='orchestrator',
        active:false,
        idle:true,
        pendingTasks:0,
        pendingMessages:false,
        label:'',
        phase:a.key==='orchestrator'?'orchestrator':a.key,
        tools:[],
        ts:0
      });
    });

    // Most-recent progress event per agent phase (for label + jobs)
    var latestByPhase={};
    (progress||[]).forEach(function(e){
      var ph=(e.phase||'').toLowerCase();
      if(!ph||ph==='thinking'||ph==='tool'||ph==='tool_call')return;
      if(!latestByPhase[ph]||(e.ts||0)>(latestByPhase[ph].ts||0))latestByPhase[ph]=e;
    });

    // Merge the live group status into the matching roster card (the
    // orchestrator). The main group carries the orchestrator's live phase,
    // label, and tools; groups[] only ever has the one "owner" entry.
    (groups||[]).forEach(function(g){
      var isMain=g.isMain||(g.name||g.jid||'').toLowerCase()==='owner';
      var key=isMain?'orchestrator':(g.name||g.jid||'').toLowerCase();
      var card=cards.find(function(c){return c.key===key;});
      if(!card){
        card={key:key,name:isMain?'Orchestrator':(g.name||g.jid),channel:g.channel||'',isMain:!!isMain,
              active:false,idle:true,pendingTasks:0,pendingMessages:false,label:'',phase:'',tools:[],ts:0};
        seen[key]=true;cards.push(card);
      }else{
        card.channel=g.channel||card.channel;
      }
      card.pendingTasks=g.pendingTasks||card.pendingTasks;
      card.pendingMessages=g.pendingMessages||card.pendingMessages;
      if(g.liveLabel)card.label=g.liveLabel;
      if(g.livePhase)card.phase=g.livePhase;
      if(g.liveTools&&g.liveTools.length)card.tools=g.liveTools;
      if(g.liveTs)card.ts=(g.liveTs||0)*1000;
    });

    // Add subagent cards from progress events (iris, atlas, dexter, etc.)
    Object.keys(latestByPhase).forEach(function(agent){
      if(seen[agent])return; // already have a card from groups
      seen[agent]=true;
      var ev=latestByPhase[agent];
      cards.push({
        key:agent,
        name:agent.charAt(0).toUpperCase()+agent.slice(1),
        channel:'subagent',
        active:false,
        idle:false,
        pendingTasks:0,
        pendingMessages:false,
        label:ev.label||'',
        phase:agent,
        tools:[],
        ts:ev.ts||0
      });
    });

    // Resolve active state. An agent is active iff its most-recent progress
    // event has jobs>0 (a running job) OR it matches the live group's
    // livePhase (the orchestrator's current phase). "complete"/"done"/"error"
    // labels always clear active regardless. The most-recent progress label
    // is surfaced as the card's activity line so idle agents show what they
    // last did.
    cards.forEach(function(c){
      var ev=latestByPhase[c.key];
      // Prefer the progress label for the activity line (the live group only
      // carries the orchestrator's current label, not each subagent's).
      if(ev&&ev.label){c.label=ev.label;c.ts=ev.ts||c.ts;}
      var labelIsDone=/complete|done|finished|error|exited/i.test(c.label||'');
      var jobsActive=!!ev&&ev.jobs>0;
      var phaseActive=!!livePhase&&(c.key===livePhase||c.name.toLowerCase()===livePhase);
      if((jobsActive||phaseActive)&&!labelIsDone){
        c.active=true;c.idle=false;
        if(phaseActive){c.label=liveLabel||c.label;c.tools=liveTools||c.tools;c.ts=Date.now();}
      }else{
        c.active=false;c.idle=true;
      }
    });

    // Sort: orchestrator always first, then active agents, then idle by name
    cards.sort(function(a,b){
      if(a.isMain&&!b.isMain)return -1;
      if(!a.isMain&&b.isMain)return 1;
      if(a.active&&!b.active)return -1;
      if(!a.active&&b.active)return 1;
      return (a.name||'').localeCompare(b.name||'');
    });

    if(!cards.length){
      list.innerHTML='<div class="empty">No agents registered.</div>';
      count.textContent='0';
      return;
    }

    count.textContent=cards.length;
    var html='';
    cards.forEach(function(c){
      var statusClass='';
      if(c.active) statusClass='active';
      else if(c.pendingMessages||c.pendingTasks) statusClass='idle-pending';

      var dotClass='';
      if(c.active) dotClass='active';
      else if(c.pendingMessages||c.pendingTasks) dotClass='idle-pending';

      var color=AGENT_COLORS[c.key]||AGENT_COLORS[c.phase]||'#00ffff';
      var icon=AGENT_ICONS[c.key]||AGENT_ICONS[c.phase]||'●';

      var toolsHtml='';
      if(c.tools&&c.tools.length){
        toolsHtml='<div class="agent-tools">'+
          c.tools.map(function(t){return '<span class="tool-tag">'+esc(t)+'</span>'}).join('')+
          '</div>';
      }

      var phaseHtml='';
      if(c.phase){
        phaseHtml='<span class="phase-badge" style="color:'+color+';border-color:'+color+'">'+esc(c.phase)+'</span>';
      }

      var activity=c.label||'';
      if(!activity&&c.active) activity='processing...';
      if(!activity&&c.idle) activity='idle';

      // Age of last activity
      var ageStr='';
      if(c.ts){
        var sec=Math.floor((now-c.ts)/1000);
        if(sec<60) ageStr='just now';
        else if(sec<3600) ageStr=Math.floor(sec/60)+'m ago';
        else ageStr=Math.floor(sec/3600)+'h ago';
      }

      var tip = esc(c.channel||'') + (ageStr?' · '+ageStr:'') +
                (activity?' · '+esc(activity):'') +
                (c.pendingTasks?' · '+c.pendingTasks+' tasks':'') +
                (c.pendingMessages?' · unread':'');
      html+='<div class="agent-card '+statusClass+'" data-agent="'+esc(c.key)+'" title="'+tip+'">'+
        '<div class="agent-top">'+
          '<div class="agent-icon" style="color:'+color+'">'+icon+'</div>'+
          '<div class="status-dot '+dotClass+'"></div>'+
          '<div class="agent-name" style="color:'+color+'">'+esc(c.name)+'</div>'+
        '</div>'+
        (activity?'<div class="agent-activity">'+esc(activity)+(ageStr?' · '+ageStr:'')+'</div>':'')+
        '<div class="badge-row">'+
          (phaseHtml||'')+
          (c.pendingTasks?'<span class="phase-badge">'+c.pendingTasks+' tasks</span>':'')+
          (c.pendingMessages?'<span class="phase-badge">unread</span>':'')+
        '</div>'+
        toolsHtml+
      '</div>';
    });
    list.innerHTML=html;
  }

  async function fetchAgents(){
    try{
      if(!window.pywebview||!window.pywebview.api||!window.pywebview.api.warden_api)return;
      var raw=await window.pywebview.api.warden_api('/api/status');
      if(!raw)return;
      var d=JSON.parse(raw);
      // Use progress events to show subagent activity
      var live=d.groups&&d.groups[0]||{};
      renderAgents(d.progress||[], d.groups||[], live.livePhase, live.liveLabel, live.liveTools);
      var now=new Date();
      document.getElementById('footer-ts').textContent=
        now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }catch(e){}
  }

  fetchAgents();
  setInterval(fetchAgents,5000);

  // ── Per-agent model + ctx popover ──────────────────────────────────────
  // Click an agent card → open a popover with that agent's Model + Ctx
  // dropdowns (populated from Warden's /api/ollama/test + /api/settings).
  // Save writes the per-agent keys back via POST /api/settings. The model
  // dropdown has no blank option — every agent always has a concrete model.
  // NOTE: Byte/Dexter/Iris/Mercury/Sentry now share the Toolcall model/ctx
  // (local:subagent_model/_ctx), but the popover still reads the replicated
  // per-agent fields the server returns for display purposes.
  var AGENT_SETTINGS_KEYS = {
    orchestrator:{name:'Orchestrator',model:'globalDefaultModel',ctx:'orchestratorCtx'},
    atlas:{name:'Atlas',model:'atlasModel',ctx:'atlasCtx'},
    artemis:{name:'Artemis',model:'artemisModel',ctx:'artemisCtx'},
    byte:{name:'Byte',model:'byteModel',ctx:'byteCtx'},
    dexter:{name:'Dexter',model:'dexterModel',ctx:'dexterCtx'},
    iris:{name:'Iris',model:'irisModel',ctx:'irisCtx'},
    vulkan:{name:'Vulkan',model:'vulkanModel',ctx:'vulkanCtx'},
    sentry:{name:'Sentry',model:'sentryModel',ctx:'sentryCtx'},
    mercury:{name:'Mercury',model:'mercuryModel',ctx:'mercuryCtx'}
  };
  var CTX_OPTIONS=['',2048,4096,8192,16384,32768,65536,128000];
  var modelCache=null, settingsCache=null, currentAgent=null;

  function apiReady(){ return window.pywebview&&window.pywebview.api&&typeof window.pywebview.api.warden_api==='function'; }

  async function loadModelList(){
    if(!apiReady())return;
    try{
      var raw=await window.pywebview.api.warden_api('/api/ollama/test');
      if(!raw)return;
      var d=JSON.parse(raw);
      if(!d||!d.ok)return;
      modelCache={models:d.models||[],sizes:d.modelSizes||{},friendly:d.friendlyNames||{},cloud:d.cloudModels||[]};
    }catch(e){}
  }
  async function loadSettings(){
    if(!apiReady())return;
    try{
      var raw=await window.pywebview.api.warden_api('/api/settings');
      if(!raw)return;
      settingsCache=JSON.parse(raw);
    }catch(e){}
  }

  function buildModelOptions(selected){
    if(!modelCache)return '';
    var out='';
    // Cloud models first (frontier), then local — both concrete, no blank.
    var seen={};
    (modelCache.cloud||[]).forEach(function(m){ if(!seen[m]){seen[m]=true; out+='<option value="'+esc(m)+'"'+(m===selected?' selected':'')+'>'+esc(m)+'</option>';} });
    (modelCache.models||[]).forEach(function(m){
      if(!m||seen[m])return; seen[m]=true;
      var label=modelCache.friendly[m]||m;
      var sz=modelCache.sizes[m];
      if(sz) label+='  ('+(sz/(1024*1024*1024)).toFixed(1)+' GB)';
      out+='<option value="'+esc(m)+'"'+(m===selected?' selected':'')+'>'+esc(label)+'</option>';
    });
    // If the current value isn't in the list (e.g. a model since removed), keep
    // it as an explicit option so the dropdown never collapses to blank.
    if(selected && !seen[selected]){
      out+='<option value="'+esc(selected)+'" selected>'+esc(selected)+' (not listed)</option>';
    }
    return out;
  }
  function buildCtxOptions(selected){
    var out='';
    CTX_OPTIONS.forEach(function(v){
      var val=v===''?'':String(v);
      var label=v===''?'default (native window)':v.toLocaleString();
      out+='<option value="'+esc(val)+'"'+(val===String(selected||'')?' selected':'')+'>'+esc(label)+'</option>';
    });
    if(selected && CTX_OPTIONS.indexOf(parseInt(selected,10))===-1 && selected!==''){
      out+='<option value="'+esc(String(selected))+'" selected>'+esc(String(selected))+'</option>';
    }
    return out;
  }

  var overlay=document.getElementById('pop-overlay');
  var popName=document.getElementById('pop-name');
  var popIcon=document.getElementById('pop-icon');
  var popModel=document.getElementById('pop-model');
  var popCtx=document.getElementById('pop-ctx');
  var popStatus=document.getElementById('pop-status');
  var popSave=document.getElementById('pop-save');

  function openPopover(key){
    var cfg=AGENT_SETTINGS_KEYS[key];
    if(!cfg)return;
    currentAgent=key;
    popName.textContent=cfg.name;
    popIcon.textContent=AGENT_ICONS[key]||'●';
    popIcon.style.color=AGENT_COLORS[key]||'#00ff88';
    popStatus.textContent=''; popStatus.className='pop-status';
    if(!modelCache) loadModelList();
    if(!settingsCache) loadSettings();
    // Defer populate until caches land (they may be loading async).
    function populate(){
      if(!modelCache||!settingsCache){ setTimeout(populate,150); return; }
      var curModel=settingsCache[cfg.model]||'';
      var curCtx=settingsCache[cfg.ctx]||'';
      popModel.innerHTML=buildModelOptions(curModel);
      popCtx.innerHTML=buildCtxOptions(curCtx);
    }
    populate();
    overlay.classList.add('open');
  }
  function closePopover(){ overlay.classList.remove('open'); currentAgent=null; }

  // Delegated click on agent cards (innerHTML is rebuilt every poll, so bind
  // once on the list container and walk up to the .agent-card).
  document.getElementById('agent-list').addEventListener('click',function(ev){
    var card=ev.target.closest('.agent-card');
    if(!card)return;
    openPopover(card.getAttribute('data-agent')||'');
  });
  document.getElementById('pop-close').addEventListener('click',closePopover);
  document.getElementById('pop-cancel').addEventListener('click',closePopover);
  overlay.addEventListener('click',function(ev){ if(ev.target===overlay) closePopover(); });

  popSave.addEventListener('click',async function(){
    if(!currentAgent||!apiReady())return;
    var cfg=AGENT_SETTINGS_KEYS[currentAgent];
    var model=popModel.value;
    var ctx=popCtx.value; // '' = default/native
    if(!model){
      popStatus.textContent='No model selected — pick a model first.'; popStatus.className='pop-status err';
      return;
    }
    popSave.disabled=true;
    popStatus.textContent='Saving…'; popStatus.className='pop-status busy';
    try{
      var body={}; body[cfg.model]=model; body[cfg.ctx]=ctx;
      await window.pywebview.api.warden_api('/api/settings','POST',JSON.stringify(body));
      // Re-fetch to confirm the save round-tripped.
      await loadSettings();
      var okModel=(settingsCache||{})[cfg.model]===model;
      if(okModel){
        popStatus.textContent='Saved.'; popStatus.className='pop-status ok';
      }else{
        popStatus.textContent='Saved, but the value did not persist as expected.'; popStatus.className='pop-status err';
      }
    }catch(e){
      popStatus.textContent='Save failed: '+(e&&e.message?e.message:e); popStatus.className='pop-status err';
    }
    popSave.disabled=false;
  });

  // Warm the caches once the bridge is ready.
  (function warm(){
    if(apiReady()){ loadModelList(); loadSettings(); }
    else setTimeout(warm,300);
  })();
})();
</script>
</body>
</html>
