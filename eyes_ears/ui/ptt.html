<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Steve Panel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050508;
    font-family: system-ui, sans-serif; user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column;
    align-items: stretch; justify-content: space-between; padding: 22px;
    box-sizing: border-box; gap: 24px; }
  button { border: none; cursor: pointer; font-weight: 800; letter-spacing: 2px;
    transition: filter .12s, transform .1s; }
  button:active { transform: scale(.97); }

  /* Big RED talk button — top of the window, dominates the panel */
  #talk { flex: 3; background: #d81b1b; color: #fff; font-size: 44px;
    border-radius: 26px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.28), 0 0 34px rgba(255,40,40,.35); }
  #talk:hover { filter: brightness(1.12); }
  #talk.on { animation: breathe 1.6s infinite; }
  @keyframes breathe { 50% { filter: brightness(.72); } }

  /* Status strip — sits BETWEEN the buttons as a wide separation gap
     so the stop sign can never be mistaken for the talk button */
  #space { min-height: 110px; border-radius: 16px; background: #0d1018;
    border: 1px solid #232a3a; color: #93a3c4; font-size: 19px; line-height: 1.4;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 10px 16px; box-sizing: border-box; }
  #space.err { color: #ff9090; border-color: #4a2020; }

  /* Bottom row — red PUSH-TO-TALK pad on the LEFT of the stop sign,
     25% its size (flex .75 vs 1, font 24 vs 32). Hold to record. */
  #row { flex: 1.6; display: flex; gap: 14px; }
  #ptt { flex: .75; background: #d81b1b; color: #fff; font-size: 24px;
    line-height: 1.15; border-radius: 14px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.28), 0 0 18px rgba(255,40,40,.25); }
  #ptt.on { animation: breathe 1.6s infinite; }

  /* Big YELLOW OCTAGON stop sign — right side of the bottom row, as far
     from TALK as the window allows. Dormant when idle; flashes hard (bright +
     scale + glow) the whole time a task is running. */
  #stop { flex: 1; background: #f5c400; color: #221800; font-size: 32px;
    border-radius: 18px;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.22); }
  #stop:hover { filter: brightness(1.1); }
  #stop.busy { animation: strobe .7s infinite; }
  @keyframes strobe {
    50% { filter: brightness(.35); transform: scale(.94); }
  }
</style>
</head>
<body>
<div class="wrap">
  <button id="talk">TALK</button>
  <div id="space"></div>
  <div id="row">
    <button id="ptt">PUSH<br>TO TALK</button>
    <button id="stop">STOP</button>
  </div>
</div>
<script>
  var talk = document.getElementById('talk'), stop = document.getElementById('stop'),
      ptt = document.getElementById('ptt'), space = document.getElementById('space');

  function paint(s) {
    if (!s || !s.ok) {
      talk.classList.remove('on'); stop.classList.remove('busy');
      ptt.classList.remove('on');
      space.textContent = 'Jarvis is not answering — check he is running.';
      space.className = 'err';
      return;
    }
    if (s.busy) {
      talk.classList.add('on'); stop.classList.add('busy');
      space.textContent = 'Working…'; space.className = '';
    } else {
      talk.classList.remove('on'); stop.classList.remove('busy');
      space.textContent = s.note || ''; space.className = '';
    }
  }

  async function poll() {
    try { paint(JSON.parse(await window.pywebview.api.status())); }
    catch (e) { paint(null); }
  }

  talk.addEventListener('click', async function () {
    try { await window.pywebview.api.talk(); } catch (e) {}
    setTimeout(poll, 300);
  });
  stop.addEventListener('click', async function () {
    try { await window.pywebview.api.stop(); } catch (e) {}
    setTimeout(poll, 300);
  });

  ptt.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ptt.classList.add('on');
    try { window.pywebview.api.ptt_down(); } catch (err) {}
  });
  function pttUp() {
    if (!ptt.classList.contains('on')) return;
    ptt.classList.remove('on');
    try { window.pywebview.api.ptt_up(); } catch (err) {}
    setTimeout(poll, 300);
  }
  ptt.addEventListener('pointerup', pttUp);
  ptt.addEventListener('pointerleave', pttUp);
  ptt.addEventListener('pointercancel', pttUp);

  poll(); setInterval(poll, 1200);
</script>
</body>
</html>
